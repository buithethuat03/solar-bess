    post:
      tags: ["Workflow"]
      summary: "Nhắc/leo thang một bước đang chờ; KHÔNG phải một chuyển trạng thái"
      description: >-
        Leo thang là một LỜI NHẮC CÓ LÝ DO, không bao giờ là một quyết định. Operation này KHÔNG
        thực hiện chuyển trạng thái nào: instance giữ nguyên `state`, `currentStepKey`,
        `currentAttemptNo` và cả `versionNo` — bản ghi chỉ tăng `escalationCount` và cập nhật
        `lastEscalatedAt`, bằng một UPDATE thô cố ý đi vòng qua cột optimistic để `expectedVersion`
        của một quyết định đang mở vẫn còn hiệu lực. Vì thế nó KHÔNG THỂ phê duyệt, từ chối, trả
        lại hay sửa hồ sơ dưới bất kỳ hoàn cảnh nào; nó chỉ đếm và thông báo. Sự kiện outbox dùng
        `escalationCount` mới làm aggregateVersion (vì `versionNo` không tăng, dùng lại nó sẽ đụng
        `uq_outbox_aggregate_event` với sự kiện start/decision cùng phiên bản). Instance đã kết
        thúc (APPROVED/REJECTED/CANCELLED/EXPIRED) không nhắc được: 422
        `INVALID_STATE_TRANSITION`, và bộ đếm không nhúc nhích. `reason` bắt buộc — mọi lời nhắc
        đều có lý do được ghi lại. Bộ lập lịch SLA của AC-072 CHƯA được phủ: không có tiến trình
        nền nào tự sinh leo thang, mọi lời nhắc đều do người gọi chủ động. Instance ngoài tenant
        hoặc ngoài scope trả 404 `WORKFLOW_INSTANCE_NOT_FOUND`; 403 chỉ dành cho người thiếu hẳn
        quyền `workflow.escalate`.
