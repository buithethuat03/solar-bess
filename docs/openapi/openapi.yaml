        kết quả bất biến. Catalog KHÔNG có operation tạo ITP, nên (quyết định V1 đã ghi nhận) lệnh
        `REQUEST` ĐẦU TIÊN cho một `{itpId}` chưa biết sẽ coi id đó là id của một document revision
        và VẬT CHẤT HÓA ITP từ đúng revision ấy — revision bắt buộc phải ISSUED và quét mã độc
        CLEAN (422 `ITP_SOURCE_NOT_ISSUED`), tài liệu phải thuộc một gói thầu (422
        `ITP_PACKAGE_REQUIRED`), và id của ITP CHÍNH LÀ id của revision (quan hệ 1:1). Mọi lệnh sau
        tìm ITP theo khóa chính; `RECORD` trên một id chưa biết không vật chất hóa gì và trả 404
        `ITP_NOT_FOUND`. Một hold point chỉ có một lượt kiểm tra đang mở (409
        `INSPECTION_ALREADY_REQUESTED`) và hold point đã PASS không được yêu cầu lại (422
        `HOLD_POINT_ALREADY_PASSED`); FAIL cho phép tái kiểm ở `sequenceNo + 1`. `RECORD` bắt buộc
        `inspectionId`, `expectedVersion`, `result` và ít nhất một bằng chứng (422
        `INSPECTION_REFERENCE_REQUIRED` / `RESULT_REQUIRED` / `EVIDENCE_REQUIRED`); kết quả chỉ ghi
        được một lần vì chỉ inspection REQUESTED mới nhận (422 `INVALID_STATE_TRANSITION`). ITP
        hoặc tài liệu nguồn ngoài tầm với đọc như không tồn tại: 404, không phải 403.
