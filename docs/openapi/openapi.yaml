        number: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{1,79}$', maxLength: 80}
        purpose: {type: string, minLength: 3, maxLength: 400}
        dueDate: {type: string, format: date}
        senderPartyId: {type: string, format: uuid, description: Phải là project party của đúng dự án này}
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/DocumentRecipient'}
        items:
