        portfolioId: {type: string, format: uuid}
        ownerLegalEntityId: {type: string, format: uuid}
        customerCompanyId: {type: [string, 'null'], format: uuid}
        projectManagerId: {type: [string, 'null'], format: uuid}
        contractModel: {type: string, minLength: 1, maxLength: 80}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
