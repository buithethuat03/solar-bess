        sánh hạn bằng chứng, nên một câu trả lời về hết hiệu lực luôn tái lập được. Trả về số đếm
        theo trạng thái gate, tổng hợp theo category, danh sách gate đang dựa trên bằng chứng đã hết
        hiệu lực, và các phát hiện CHẶN COD: punch item `cod_blocking` chưa đóng, NCR CRITICAL chưa
        đóng, lệnh dừng việc chưa được gỡ. AN TOÀN HỎNG THÌ ĐÓNG: nếu chính sổ stop-work không đọc
        được thì kết quả vẫn là một phát hiện chặn tổng hợp, không bao giờ là một cái nhún vai cho
        qua. Phát hiện chặn được đọc QUA tầm với của người gọi (NCR còn bị thu hẹp thêm theo package
        reach) và chỉ mang id, mã tham chiếu và phân loại — không mô tả punch, không diễn giải NCR,
        không lý do dừng việc. Cùng một hàm thuần này quyết định `readyToSign` cho `SIGN_COD` của
        API-105, nên một chữ ký không bao giờ bị phán xử bởi một bản luật thứ hai đã trôi. Dự án
        ngoài tenant hoặc ngoài tầm với trả 404 `PROJECT_NOT_FOUND`, không phải 403.
