        (payment, components, cả hóa đơn mới) rollback cùng nhau. FX snapshot tùy chọn cũng
        reuse-or-create trên (source, ngày, cặp tiền); cùng khóa khác tỷ giá trả 409
        `FX_SNAPSHOT_CONFLICT` — snapshot bất biến, chỉ ghi lại tỷ giá được tham chiếu, không quy
