  "/v1/delegations":
    post:
      tags: ["Identity & Tenant"]
      summary: "Tạo delegation bounded, không chain, không mở rộng quyền"
      description: >-
        Ủy quyền có biên và sâu đúng một cấp. Người ủy quyền LUÔN là người gọi — body không có
        `delegatorId`, nên không ai tạo được ủy quyền nhân danh người khác. Tự ủy quyền cho mình trả
        422 `DELEGATION_SELF_FORBIDDEN`; người nhận phải tồn tại và ACTIVE trong cùng tenant (422
        `DELEGATE_NOT_FOUND`). Cấm chuỗi (SEC-110): nếu trong cửa sổ đề nghị người gọi đang là
        delegate của người khác thì trả 422 `DELEGATION_CHAIN_FORBIDDEN`, để quyền không chảy
        A→B→C mà không ai nhìn thấy. Trùng cặp người và giai đoạn khi đã có delegation ACTIVE trả
        409 `DELEGATION_OVERLAP`. `effectiveTo` phải sau `effectiveFrom` (422
        `DELEGATION_WINDOW_INVALID`). Trường `valueLimit` bị TỪ CHỐI thẳng 422
        `VALUE_LIMIT_NOT_SUPPORTED` trước khi ghi bất cứ thứ gì: engine không phơi ngữ cảnh tiền tệ
        nào nên một hạn mức được lưu mà không có cơ chế cưỡng chế chỉ là kiểm soát giả. `scope` chỉ
        thu hẹp phạm vi (danh sách mã workflow definition và projectId), không bao giờ mở rộng
        quyền gốc của người ủy quyền.
      operationId: api_011_post_v1_delegations
      x-api-id: "API-011"
      x-implementation-status: implemented
      x-permission: "delegation.create"
      x-data-scope: "delegator luôn là người gọi; scope chỉ thu hẹp, không mở rộng"
      x-idempotency: "required; DB-101 command receipt phát lại nguyên trạng"
      x-related-requirements: ["FR-150"]
      x-related-data: ["DB-008"]
      x-related-security: ["SEC-108", "SEC-110"]
      x-error-codes: ["VALUE_LIMIT_NOT_SUPPORTED", "DELEGATION_WINDOW_INVALID", "DELEGATION_SELF_FORBIDDEN", "DELEGATE_NOT_FOUND", "DELEGATION_CHAIN_FORBIDDEN", "DELEGATION_OVERLAP", "PERMISSION_DENIED", "IDEMPOTENCY_KEY_REQUIRED", "IDEMPOTENCY_CONFLICT", "COMMAND_IN_PROGRESS"]
      security:
        - bearerAuth: []
