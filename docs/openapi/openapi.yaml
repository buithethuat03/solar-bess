        revisionId: {type: string, format: uuid, description: Phải là revision đã ISSUED thuộc đúng dự án trong path}
        actionCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,39}$', maxLength: 40}
        responseDue: {type: string, format: date}
