        chặn COD và KHÔNG BAO GIỜ waive được — khai `codBlocking: false` hoặc `waivable: true` cho
        A trả 422 `PUNCH_CATEGORY_A_INVALID`, và cơ sở dữ liệu chốt lại bằng
        `ck_punch_category_a_blocking`/`ck_punch_category_a_not_waivable`; `WAIVE` trên một punch
        không waive được trả 422 `PUNCH_NOT_WAIVABLE`. Đóng punch đi qua một vòng yêu cầu–quyết
        định: `REQUEST_CLOSURE` cần thuyết minh và bằng chứng (422 `REASON_REQUIRED` /
        `EVIDENCE_REQUIRED`), mỗi punch chỉ có một vòng đang mở (409 `CLOSURE_CYCLE_OPEN`), và
        người yêu cầu đóng không được tự quyết định, người phụ trách punch không được tự xác nhận
        đóng (422 `SOD_CONFLICT`, chốt lại bằng constraint). Quyết định RETURN đưa punch về OPEN
        thay vì CLOSED. Dự án ngoài tầm với trả 404 `PROJECT_NOT_FOUND`; punch không thuộc dự án này
        trả 404 `PUNCH_NOT_FOUND`.
