          items: {$ref: '#/components/schemas/TransmittalItemInput'}
          description: Mỗi revision chỉ được xuất hiện một lần, trùng lặp trả 422 TRANSMITTAL_ITEM_DUPLICATED
      additionalProperties: false
    RecordTransmittalResponseRequest:
      type: object
      required: [revisionId, responseCode]
      properties:
        revisionId: {type: string, format: uuid, description: Xác định item trong transmittal cần ghi phản hồi}
        responseCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,39}$', maxLength: 40}
        responseNote: {type: string, minLength: 1, maxLength: 2000}
