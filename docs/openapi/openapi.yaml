        punch mới ở OPEN (trùng mã trong dự án trả 409 `PUNCH_CODE_CONFLICT`); các lệnh còn lại bắt
        buộc `punchItemId` và `expectedVersion` (422 `PUNCH_REFERENCE_REQUIRED`, lệch phiên bản trả
