  "/v1/saved-views":
    get:
      tags: ["Search & Reporting"]
      summary: "Liệt kê saved view riêng tư của chính người gọi"
      description: >-
        Trang saved view của CHÍNH người gọi, mới nhất trước theo keyset cursor `createdAt`/`id`,
        lọc được theo `targetType`. V1 chỉ có một share scope là `PRIVATE`, nên không có gì khác để
        liệt kê: mệnh đề `ownerUserId = :callerId` nằm trong câu truy vấn và view của đồng nghiệp
        không bao giờ xuất hiện. Saved view chỉ lưu TRẠNG THÁI TRÌNH BÀY (bộ lọc, cột, sắp xếp),
        không bao giờ lưu quyền — mở một view không mở thêm dữ liệu, vì mọi register vẫn tự thẩm
        định scope khi được truy vấn. Cursor sai định dạng trả 400 `INVALID_CURSOR`. Endpoint không
        có tài nguyên theo đường dẫn nên không có 404.
      operationId: api_131_get_v1_saved_views
      x-api-id: "API-131"
      x-implementation-status: implemented
      x-permission: "savedView.read"
      x-data-scope: "chỉ view do chính người gọi sở hữu; V1 chỉ có shareScope PRIVATE"
      x-idempotency: "safe; opaque keyset cursor theo createdAt/id giảm dần"
      x-related-requirements: ["FR-172"]
      x-related-data: ["DB-106"]
      x-related-security: ["SEC-107"]
      x-error-codes: ["INVALID_CURSOR", "PERMISSION_DENIED"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 500}
          description: Opaque cursor từ meta.nextCursor; đi tới null để duyệt hết
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: targetType
          in: query
          required: false
          schema: {$ref: '#/components/schemas/SavedViewTargetType'}
      responses:
        '200':
          description: "Trang saved view của chính người gọi, mới nhất trước"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedViewListResponse'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
    post:
      tags: ["Search & Reporting"]
      summary: "Tạo saved view PRIVATE; view không bao giờ mang theo quyền"
      description: >-
        Saved view là PRIVATE theo cấu trúc trong V1. `shareScope` được nhận như văn bản tự do một
        cách có chủ đích để mọi giá trị khác `PRIVATE` nổi lên thành 422 `SHARE_SCOPE_NOT_SUPPORTED`
        thay vì chìm trong một lỗi validation vô danh; hàng ghi xuống luôn mang `PRIVATE` và
        `ck_saved_view_share_scope` chốt lại điều đó. Hệ quả: một saved view KHÔNG THỂ nâng quyền
        của ai — chia sẻ view sẽ tái phát hành bộ lọc mà không tái thẩm định quyền của người nhận,
        nên V1 đơn giản không cho phép. `ownerUserId` luôn là người gọi (body không có trường nào
        đặt chủ sở hữu). Trùng tên cho cùng register của cùng một chủ sở hữu trả 409
        `SAVED_VIEW_EXISTS`; người khác vẫn được dùng lại tên đó. Endpoint không có tài nguyên theo
