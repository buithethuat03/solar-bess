  "/v1/projects/{projectId}/bill-of-materials:release":
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: ["Engineering & Plants"]
      summary: "Release immutable BOM version"
      description: >-
        Create-and-release trong MỘT lệnh — bản đọc V1 trung thực đã được ghi nhận: catalog không
        có operation nào tạo hay sửa BOM DRAFT, nên lệnh nhận thẳng nội dung nháp
        (`designRevisionId` + `lines`) và tạo-rồi-release version kế tiếp trong một transaction
        (số version là MAX+1 của dự án cấp ngay trong transaction; thua cuộc đua song song trả
        409 `BOM_VERSION_CONFLICT`). Design revision phải thuộc đúng dự án (422
        `DESIGN_REVISION_NOT_FOUND`) và phải ISSUED với kết quả quét CLEAN (422
        `DESIGN_REVISION_LOCKED` — chuỗi SEC-121: không BOM nào release trên bản vẽ chưa phát
        hành hay chưa sạch). SoD là deviation được ghi nhận: luật tài liệu "người release ≠ tác
        giả BOM" bất khả thi khi create-and-release làm người release chính là tác giả hàng, nên
        luật được ép là người release phải khác người upload design revision (422 `RELEASE_SOD`).
        `snapshotHash` băm canonical nội dung dòng ĐÚNG DẠNG Postgres lưu, theo thứ tự `lineNo`;
        bản release trước bị supersede nguyên tử trong cùng transaction trước khi hàng mới thành
        RELEASED, nên dự án không bao giờ có hai bản RELEASED. Hàng RELEASED/SUPERSEDED và dòng
        của chúng bị trigger đóng băng kể cả qua raw SQL. Trả 200 đồng bộ (không phải 202); mọi
        4xx không ghi gì.
