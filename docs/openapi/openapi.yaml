    HseIncidentType:
      type: string
      enum: [NEAR_MISS, FIRST_AID, MEDICAL_TREATMENT, LOST_TIME, FATALITY, ENVIRONMENTAL, PROPERTY_DAMAGE, SECURITY, OTHER]
    HseSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    StopWorkAction:
      type: string
      enum: [ISSUE, LIFT]
      description: >-
        ISSUE cần quyền stopWork.issue (mọi vai trò); LIFT cần stopWork.lift (chỉ HSE_MANAGER).
    StopWorkTargetType:
      type: string
      enum: [PROJECT, SITE, WORKFRONT, PERMIT]
      description: CHECK của cơ sở dữ liệu buộc đúng một cột định danh tương ứng phải có giá trị
    InspectionStatus:
      type: string
