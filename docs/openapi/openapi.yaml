      summary: "Liệt kê system/subsystem/readiness"
      description: >-
        Register system/subsystem của một dự án, mới nhất trước theo keyset cursor `createdAt`/`id`,
        lọc được theo `status`, `systemType` và `parentSystemId`. Tầm với ABAC được áp TRONG SQL
        trước khi phân trang: principal chỉ giữ package scope nhận thêm một mệnh đề EXISTS trên các
        gói ACTIVE của dự án ngay trong câu truy vấn, nên trang trả về không bao giờ bị khoét lỗ vì
        lọc sau phân trang. Hàng commissioning KHÔNG có chiều package — system, test pack và test run
        thuộc về cả dự án — nên tầm với gói được quyết định đúng một lần, ở mức dự án. Dự án ngoài
        tenant, không tồn tại, hoặc mà người gọi không với tới đều trả 404 `PROJECT_NOT_FOUND` và
        không phân biệt được với nhau; 403 `PERMISSION_DENIED` chỉ dành cho người thiếu hẳn quyền
