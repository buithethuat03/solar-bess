        notes: {type: [string, 'null'], maxLength: 4000}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    SurveyPackageCommandView:
      type: object
      description: Survey revision vừa ghi kèm stage của opportunity SAU lệnh
      required: [id, opportunityId, revision, dataQuality, documentRefs, notes, versionNo, createdBy, updatedBy, createdAt, updatedAt, opportunityStage]
      properties:
        id: {type: string, format: uuid}
        opportunityId: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        dataQuality: {$ref: '#/components/schemas/SurveyDataQuality'}
        documentRefs:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 500}
        notes: {type: [string, 'null'], maxLength: 4000}
        versionNo: {type: integer, minimum: 1}
