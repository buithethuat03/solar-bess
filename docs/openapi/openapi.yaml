    InspectionResult:
      type: string
      enum: [PASS, FAIL]
      description: FAIL mở đường cho một lượt tái kiểm ở sequenceNo + 1; PASS thì đóng hold point
    NcrStatus:
      type: string
      enum: [OPEN, CONTAINED, ROOT_CAUSE, DISPOSITION_PROPOSED, RETURNED, DISPOSITION_APPROVED, RECTIFICATION, READY_FOR_VERIFICATION, CLOSED, REOPENED]
    NcrDisposition:
      type: string
      enum: [REWORK, REPAIR, USE_AS_IS, SCRAP, REJECT]
    QualityCycleDecision:
      type: string
      enum: [APPROVE, RETURN]
    PunchCategory:
      type: string
      enum: [A, B, C, D]
      description: A về mặt cấu trúc luôn chặn COD và không bao giờ waive được
    PunchItemStatus:
      type: string
