  "/v1/audit-events":
    get:
      tags: ["Identity & Tenant"]
      summary: "Tra cứu audit trail dưới mandate tenant cứng"
      description: >-
        Trang audit của đúng tenant người gọi, mới nhất trước theo keyset cursor `occurredAt`/`id`,
        lọc được theo `objectType`, `objectId`, `actorId`, `action` và khoảng `occurredFrom`/
        `occurredTo`. Mandate là cứng: mệnh đề `tenant_id = :tenantId` nằm trong chính câu truy vấn,
        nên hàng của tenant khác không bao giờ xuất hiện. Hàng cấp nền tảng mang `tenant_id` NULL
        cũng cố ý KHÔNG với tới được — quản trị viên tenant audit tenant của mình chứ không audit
        nền tảng, và các hàng NULL sẽ làm rò rỉ sự kiện vận hành xuyên tenant. Cursor sai định dạng
        trả 400 `INVALID_CURSOR`, không bao giờ âm thầm bỏ phân trang. Endpoint không có tài nguyên
        theo đường dẫn nên không có 404.
      operationId: api_013_get_v1_audit_events
      x-api-id: "API-013"
      x-implementation-status: implemented
      x-permission: "audit.read"
      x-data-scope: "tenant cứng; hàng platform (tenant NULL) không với tới được"
