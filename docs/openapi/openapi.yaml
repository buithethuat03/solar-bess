        displayName: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, format: email, maxLength: 254}
        signedAt: {type: string, format: date-time}
        contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
      additionalProperties: false
    DailyLog:
      type: object
      description: DB-056 daily log; một ô (site, nhà thầu, ngày, ca) chỉ có một hàng đang hiệu lực
      required: [id, projectId, siteId, contractorCompanyId, logDate, shift, revision, status, summary, details, correctionOfId, reason, signerSnapshot, signedBy, signedAt, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        contractorCompanyId: {type: string, format: uuid}
