  "/v1/projects/{projectId}/cod-transition-commands":
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: ["Commissioning & COD"]
      summary: "Submit/sign COD hoặc accept handover theo command type"
      description: >-
        LỆNH HỢP ĐÓNG trên `commandType`: `DEFINE_GATE`, `REVIEW_EVIDENCE`, `WAIVE_GATE`,
        `SUBMIT_COD`, `SIGN_COD`, `ACCEPT_HANDOVER`. Tóm tắt trong catalog chỉ nêu
        submit/sign/accept, nhưng AC-058 (khai báo từng điều kiện COD kèm nguồn, cờ bắt buộc/miễn
        trừ được, người thẩm tra, bằng chứng và hạn), AC-059 (người thẩm tra độc lập ghi
        Pass/Fail/Conditional trên bằng chứng đã nộp) và AC-060 (điều kiện đang bị chặn không được
        miễn trừ) đều cần đường ghi mà không operation nào khác trong catalog cung cấp. Bịa thêm mã
        API bị `AGENTS.md` §4 cấm, nên ba lệnh còn thiếu nhập vào chính union này — đúng tiền lệ
        API-149 vốn đã mang một union đóng các chuyển tiếp dưới một mã duy nhất. Union là ĐÓNG:
        `commandType` ngoài danh sách bị chặn ở tầng validate với 400 và không bao giờ tới service.
        AC-059 được thi hành hai lớp: người nộp bằng chứng không bao giờ được tự thẩm tra bằng chứng
        đó (422 `SOD_CONFLICT`, chốt chặn cuối `ck_cod_gate_review_cycle_sod`), và bằng chứng đã hết
        hiệu lực không bao giờ kết luận đạt (422 `EVIDENCE_EXPIRED`). AC-060: gate khai báo không
        miễn trừ được thì không bao giờ mang trạng thái WAIVED (422 `NON_WAIVABLE_GATE`, chốt chặn
        `ck_cod_gate_waiver_allowed`). Gate đã ACCEPTED/WAIVED bị trigger đóng băng — mọi lệnh tiếp
        theo trả 422 `INVALID_STATE_TRANSITION`.
        FR-113: `SUBMIT_COD` ĐƯỢC PHÉP ghi lại một bức tranh No-go; chính CHỮ KÝ mới là thứ bị từ
        chối. `SIGN_COD` đòi người ký KHÁC người trình (422 `SOD_CONFLICT`, chốt chặn
        `ck_cod_package_sod`) và bị từ chối khi còn bất kỳ phát hiện chặn nào đang mở (422
        `GATE_BLOCKED`): punch item hạng A, NCR CRITICAL chưa đóng, lệnh dừng việc chưa gỡ, hoặc còn
        một điều kiện COD bắt buộc chưa đạt. Hàng đã ký lưu snapshot readiness cùng `snapshotHash`
        là SHA-256 canonical của đúng thứ được ký, và một snapshot người ký BẤT BIẾN dùng id ổn định
        — không bao giờ chỉ là một chuỗi hiển thị.
        SEC-102 (step-up authentication) KHÔNG tồn tại trong auth profile đã được duyệt: không có
        yếu tố xác thực bổ sung, không có endpoint tái xác thực, phiên không mang mức đảm bảo nào.
        Giả lập một step-up sẽ ghi nhận một mức đảm bảo chưa từng đạt được, nên nó CỐ Ý không được
        giả lập; bù lại là SoD trên chữ ký, snapshot người ký bất biến, và audit + outbox nằm trong
        cùng transaction ký. Đóng SEC-102 cần thay đổi auth profile — đây được ghi nhận là khoảng
        trống, không phải một tính năng đã có.
        Hồ sơ đã SIGNED chỉ còn ĐÚNG HAI nước đi: handover đẩy nó sang HANDED_OVER, và đặt legal
        hold. GỠ legal hold luôn bị trigger từ chối — hold được đặt đúng vào những hồ sơ đã hoàn tất,
        nên từ chối việc đặt nó sẽ làm control vô dụng đúng trên thứ nó sinh ra để bảo vệ. Hồ sơ
        HANDED_OVER là lịch sử bất biến, và một bên nhận chỉ ký nhận đúng một lần (409
        `HANDOVER_ALREADY_ACCEPTED`). Dự án ngoài tenant hoặc ngoài tầm với trả 404
        `PROJECT_NOT_FOUND`; gate hoặc hồ sơ không có trong dự án trả 404 `COD_GATE_NOT_FOUND` /
        `COD_PACKAGE_NOT_FOUND` — không bao giờ 403. Mọi nhánh đã commit trả 200, không bao giờ 202.
      operationId: api_105_post_v1_projects_projectid_cod_transition_commands
