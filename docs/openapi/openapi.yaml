  "/v1/bess-plants/{bessPlantId}:simulate-dispatch":
    parameters:
      - name: bessPlantId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: ["Engineering & Plants"]
      summary: "Chạy mô phỏng dispatch advisory; không phát setpoint"
      description: >-
        Advisory KHÔNG TRẠNG THÁI: thẩm định kịch bản dispatch với operating envelope ĐÃ RELEASE
        của site — site chưa có bản release trả 422 `OPERATING_ENVELOPE_MISSING`, envelope đã
        release nhưng thiếu cấu trúc tối thiểu trả 422 `OPERATING_ENVELOPE_INVALID` — bằng số
        học thập phân chính xác trên chuỗi, không bao giờ float. Kịch bản bất khả thi KHÔNG phải
        lỗi HTTP: mã BESS_CONSTRAINT_INFEASIBLE trong tài liệu được trả in-band là
        `feasible: false` kèm danh sách ràng buộc bị vi phạm (`violations`) trong response 200.
        Lệnh persist DUY NHẤT command receipt của nó — không audit row, không outbox event — nên
        không thứ gì mang hình dạng lệnh có thể rời khỏi đây về phía OT (SEC-128); verdict là
        con số tham khảo, không bao giờ là setpoint, và PM Web không phát gì tới
        BESS/PCS/BMS/EMS/SCADA. Phát lại cùng `Idempotency-Key` trả lại verdict đã lưu thay vì
        tính lại; plant ngoài tenant hoặc ngoài scope trả 404 `BESS_PLANT_NOT_FOUND` chứ không
        phải 403.
