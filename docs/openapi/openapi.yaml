  "/v1/delegations/{delegationId}:revoke":
    parameters:
      - name: delegationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: ["Identity & Tenant"]
      summary: "Thu hồi delegation ngay lập tức"
      description: >-
        Thu hồi có hiệu lực ngay: hàng chuyển REVOKED kèm `revokedBy`/`revokedAt`, và một delegation
        đã thu hồi không còn trao quyền cho ai nữa. Mandate hẹp và được che đúng cách — chỉ chính
        delegator hoặc người mang role `TENANT_ADMIN` nhìn thấy hàng này qua đường revoke; người
        khác (kể cả người có `delegation.revoke`) nhận 404 `DELEGATION_NOT_FOUND` y hệt trường hợp
        không tồn tại, nên ngoài mandate không phân biệt được với không có. Kiểm tra dùng MÃ ROLE
        `TENANT_ADMIN` chứ không phải một permission, để một grant mới sau này không âm thầm mở rộng
        chiếc công tắc này. Gọi lại trên hàng đã REVOKED hội tụ im lặng: vẫn 200 với cùng trạng
        thái, không phải 409.
