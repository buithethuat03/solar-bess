openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Solar & BESS Project Management Platform API
  version: 0.9.3
  description: >-
    Draft vendor-neutral contract. Unknown domain fields remain TBD. PM/O&M operations
    cannot start, stop, reset, bypass, clear source alarms, or send BESS/OT setpoints.
servers:
  - url: /
    description: Relative deployment URL; host and environment are TBD
tags:
  - name: "Identity & Tenant"
  - name: "Portfolio & Project"
  - name: "Opportunity"
  - name: "Project Controls"
  - name: "Risk & Change"
  - name: "Document Control"
  - name: "Contract & Cost"
  - name: "Engineering & Plants"
  - name: "Procurement & Logistics"
  - name: "Field, HSE & Quality"
  - name: "Commissioning & COD"
  - name: "Workflow"
  - name: "O&M"
  - name: "Integration"
  - name: "Webhook"
  - name: "AI Governance"
  - name: "Search & Reporting"
security:
  - bearerAuth: []
paths:
  "/v1/auth/login":
    post:
      tags: ["Identity & Tenant"]
      summary: "Đăng nhập local cho base/test profile"
      operationId: api_137_post_v1_auth_login
      x-api-id: "API-137"
      x-implementation-status: implemented
      x-permission: "public"
      x-data-scope: "tenant resolved server-side from tenantCode"
      x-idempotency: "not required; rate limited"
      x-related-requirements: ["FR-147"]
      x-related-data: ["DB-001", "DB-005", "DB-099", "DB-100"]
      x-related-security: ["SEC-101", "SEC-103", "SEC-117", "SEC-118"]
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthLoginRequest'}
      responses:
        '200':
          description: "Authenticated; refresh JWT is set as HttpOnly cookie"
          headers:
            Set-Cookie:
              schema: {type: string}
              description: "refresh_token cookie; HttpOnly, SameSite=Lax, Path=/v1/auth"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthTokenResponse'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
  "/v1/auth/refresh":
    post:
      tags: ["Identity & Tenant"]
      summary: "Rotate refresh JWT và cấp access JWT mới"
      operationId: api_138_post_v1_auth_refresh
      x-api-id: "API-138"
      x-implementation-status: implemented
      x-permission: "valid refresh session"
      x-data-scope: "signed tenant/user/session claims"
      x-idempotency: "single-use rotation"
      x-related-requirements: ["FR-147"]
      x-related-data: ["DB-005", "DB-100"]
      x-related-security: ["SEC-103", "SEC-117", "SEC-118"]
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
        - $ref: '#/components/parameters/CorrelationHeader'
      responses:
        '200':
          description: "Rotated; a new refresh JWT is set as HttpOnly cookie"
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthTokenResponse'}
        '401': {$ref: '#/components/responses/Error401'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
  "/v1/auth/logout":
    post:
      tags: ["Identity & Tenant"]
      summary: "Thu hồi refresh session và xóa cookie"
      operationId: api_139_post_v1_auth_logout
      x-api-id: "API-139"
      x-implementation-status: implemented
      x-permission: "refresh session if present"
      x-data-scope: "signed tenant/user/session claims"
      x-idempotency: "idempotent"
      x-related-requirements: ["FR-147"]
      x-related-data: ["DB-005", "DB-100"]
      x-related-security: ["SEC-103", "SEC-118"]
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
        - $ref: '#/components/parameters/CorrelationHeader'
      responses:
        '204':
          description: "Logged out or no current session; refresh cookie cleared"
          headers:
            Set-Cookie:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error400'}
        '500': {$ref: '#/components/responses/Error500'}
  "/v1/me":
    get:
      tags: ["Identity & Tenant"]
      summary: "Đọc identity, tenant context và profile hiệu lực"
      operationId: api_001_get_v1_me
      x-api-id: "API-001"
      x-implementation-status: implemented
      x-permission: "authenticated"
      x-data-scope: "current tenant/user"
      x-idempotency: "safe"
      x-related-requirements: ["FR-146"]
      x-related-data: ["DB-001", "DB-005"]
      x-related-security: ["SEC-101", "SEC-105"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
      responses:
        '200':
          description: "Authorized result"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthIdentityResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  "/v1/me/permissions":
    get:
      tags: ["Identity & Tenant"]
      summary: "Đọc effective action/data scope có giải thích an toàn"
      description: >-
        View mỏng trên đúng một bộ đánh giá quyền mà các guard đang dùng
        (`PermissionService.identityPermissions()`), không phải bộ đánh giá thứ hai có thể trôi khỏi
        bộ gốc — nếu hai bên lệch nhau thì màn hình giải thích sẽ nói dối về quyền thật. Trả về
        `roles`, tập `permissions` hợp nhất đã sắp xếp và từng assignment còn hiệu lực kèm
        `scopeType`/`scopeId` để client trả lời được "vì sao được phép". `policyVersion` là giá trị
        lớn nhất trong các role ACTIVE của người gọi (0 khi không có role nào) — mốc cho biết câu
        trả lời sinh ra từ bản catalog nào. Endpoint chỉ đọc chính người gọi: không có tham số nào
        hỏi về người khác, nên không thể dùng để dò quyền của người khác. Thiếu hẳn
        `permission.read.self` bị guard chặn 403 `PERMISSION_DENIED` trước khi service chạy.
      operationId: api_002_get_v1_me_permissions
      x-api-id: "API-002"
      x-implementation-status: implemented
      x-permission: "permission.read.self"
      x-data-scope: "chính người gọi; không có tham số để hỏi về người khác"
      x-idempotency: "safe"
      x-related-requirements: ["FR-147"]
      x-related-data: ["DB-006", "DB-007", "DB-008"]
      x-related-security: ["SEC-106", "SEC-107"]
      x-error-codes: ["PERMISSION_DENIED"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
      responses:
        '200':
          description: "Quyền hiệu lực của người gọi, giải thích theo từng assignment"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MePermissionsResponse'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
  "/v1/tenants/{tenantId}":
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: ["Identity & Tenant"]
      summary: "Đọc tenant configuration của chính người gọi"
      description: >-
        Chỉ đọc được đúng tenant trong claim của người gọi. Mọi `tenantId` khác — dù tenant đó có
        tồn tại hay không — trả 404 `TENANT_NOT_FOUND` với cùng một thân lỗi, nên không thể dò sự
        tồn tại của tenant khác; 403 chỉ dành cho người thiếu hẳn quyền `tenant.read`. Response chỉ
        mang các cột thật của DB-001 (`id`, `code`, `name`, `status`, `createdAt`, `updatedAt`);
        trường `locale` trong bản phác thảo thiết kế chưa tồn tại trên bảng nên không được bịa ra.
        `tenantId` không phải UUID bị `ParseUUIDPipe` chặn 400 trước khi chạm service.
      operationId: api_003_get_v1_tenants_tenantid
      x-api-id: "API-003"
      x-implementation-status: implemented
      x-permission: "tenant.read"
      x-data-scope: "đúng tenant trong claim; tenant khác là 404, không phải 403"
      x-idempotency: "safe"
      x-related-requirements: ["FR-146"]
      x-related-data: ["DB-001"]
      x-related-security: ["SEC-105"]
      x-error-codes: ["TENANT_NOT_FOUND", "PERMISSION_DENIED"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
      responses:
        '200':
          description: "Cấu hình tenant của chính người gọi; chỉ các cột thật của DB-001"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantResponse'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
  "/v1/companies":
    get:
      tags: ["Identity & Tenant"]
      summary: "Liệt kê Company theo scope"
      operationId: api_004_get_v1_companies
      x-api-id: "API-004"
      x-implementation-status: implemented
      x-permission: "organization.read"
      x-data-scope: "tenant/company"
      x-idempotency: "safe"
      x-related-requirements: ["FR-037"]
      x-related-data: ["DB-002"]
      x-related-security: ["SEC-105", "SEC-107"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
      responses:
        '200':
          description: "Authorized result"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      tags: ["Identity & Tenant"]
      summary: "Tạo Company master"
      operationId: api_005_post_v1_companies
      x-api-id: "API-005"
      x-implementation-status: implemented
      x-permission: "organization.create"
      x-data-scope: "tenant"
      x-idempotency: "required"
      x-related-requirements: ["FR-037"]
      x-related-data: ["DB-002"]
      x-related-security: ["SEC-104", "SEC-107"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '202':
          description: "Accepted or committed command result"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  "/v1/legal-entities":
    get:
      tags: ["Identity & Tenant"]
      summary: "Liệt kê LegalEntity theo scope"
      operationId: api_006_get_v1_legal_entities
      x-api-id: "API-006"
      x-implementation-status: implemented
      x-permission: "legalEntity.read"
      x-data-scope: "tenant/legal entity"
      x-idempotency: "safe"
      x-related-requirements: ["FR-037"]
      x-related-data: ["DB-003"]
      x-related-security: ["SEC-107", "SEC-114"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
      responses:
        '200':
          description: "Authorized result"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      tags: ["Identity & Tenant"]
      summary: "Đăng ký LegalEntity bằng stable identity"
      operationId: api_007_post_v1_legal_entities
      x-api-id: "API-007"
      x-implementation-status: implemented
      x-permission: "legalEntity.create"
      x-data-scope: "tenant/company"
      x-idempotency: "required"
      x-related-requirements: ["FR-037"]
      x-related-data: ["DB-003"]
      x-related-security: ["SEC-104", "SEC-114"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegalEntityRequest'
      responses:
        '202':
          description: "Accepted or committed command result"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  "/v1/users":
    get:
      tags: ["Identity & Tenant"]
      summary: "Liệt kê assignee active theo project/package/capability"
      operationId: api_008_get_v1_users
      x-api-id: "API-008"
      x-implementation-status: implemented
      x-permission: "user.read"
      x-data-scope: "active users with effective full-project or matching-package assignment and allowlisted required permission"
      x-idempotency: "safe; cursor/limit/search"
      x-related-requirements: ["FR-099", "FR-100", "FR-146"]
      x-related-data: ["DB-005", "DB-006", "DB-007"]
      x-related-security: ["SEC-105", "SEC-107", "SEC-111", "SEC-130"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
        - name: projectId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: packageId
          in: query
          schema: {type: string, format: uuid}
        - name: requiredPermission
          in: query
          required: true
          schema: {type: string, enum: [riskChange.read, riskChange.manage]}
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 100}
        - $ref: '#/components/parameters/RiskChangeCursor'
        - $ref: '#/components/parameters/RiskChangeLimit'
      responses:
        '200':
          description: "Authorized active assignees; minimal identity fields only"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAssigneeListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  "/v1/role-assignments":
    post:
      tags: ["Identity & Tenant"]
      summary: "Cấp role assignment có scope và effective window"
      description: >-
        Cấp một assignment ACTIVE cho người dùng trong cùng tenant. V1 chỉ nhận ba scope kind
        `TENANT`/`PROJECT`/`PACKAGE`; `PORTFOLIO` cố ý nằm ngoài phạm vi nên bị validation từ chối
        400 thay vì được lưu như một scope không ai diễn giải. Scope `TENANT` không được kèm
        `scopeId` và `PROJECT`/`PACKAGE` bắt buộc phải có, sai quy tắc trả 422 `SCOPE_INVALID`; đối
        tượng scope phải thuộc đúng tenant (422 `PROJECT_NOT_FOUND` / `PACKAGE_NOT_FOUND`, package
        còn phải ACTIVE). Role và người dùng phải tồn tại và ACTIVE (422 `ROLE_NOT_FOUND` /
        `USER_NOT_FOUND`). `effectiveFrom` bỏ trống mặc định là thời điểm gọi; `effectiveTo` nếu có
        phải sau `effectiveFrom` (422 `EFFECTIVE_WINDOW_INVALID`). Trùng bộ (user, role, scope) khi
        đã có hàng ACTIVE trả 409 `ROLE_ASSIGNMENT_EXISTS` — chốt chặn là unique
        `uq_role_assignment_active_tuple`, service chỉ dịch lỗi của nó. `Idempotency-Key` bắt buộc.
      operationId: api_009_post_v1_role_assignments
      x-api-id: "API-009"
      x-implementation-status: implemented
      x-permission: "roleAssignment.grant"
      x-data-scope: "tenant-level; đối tượng scope phải thuộc đúng tenant"
      x-idempotency: "required; DB-101 command receipt phát lại nguyên trạng"
      x-related-requirements: ["FR-148"]
      x-related-data: ["DB-006", "DB-007"]
      x-related-security: ["SEC-104", "SEC-106", "SEC-107"]
      x-error-codes: ["ROLE_NOT_FOUND", "USER_NOT_FOUND", "SCOPE_INVALID", "PROJECT_NOT_FOUND", "PACKAGE_NOT_FOUND", "EFFECTIVE_WINDOW_INVALID", "ROLE_ASSIGNMENT_EXISTS", "PERMISSION_DENIED", "IDEMPOTENCY_KEY_REQUIRED", "IDEMPOTENCY_CONFLICT", "COMMAND_IN_PROGRESS"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRoleAssignmentRequest'}
      responses:
        '201':
          description: "Assignment ACTIVE đã được ghi kèm cửa sổ hiệu lực"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAssignmentCommandResponse'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '500': {$ref: '#/components/responses/Error500'}
  "/v1/role-assignments/{roleAssignmentId}":
    parameters:
      - name: roleAssignmentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: ["Identity & Tenant"]
      summary: "Thu hồi role assignment, giữ nguyên hàng lịch sử"
      description: >-
        Thu hồi là ĐỔI TRẠNG THÁI, không phải xóa (SEC-118): hàng DB-007 vẫn còn với
        `status = INACTIVE`, nên lịch sử "ai từng được phép, trong khoảng nào" luôn dựng lại được.
        Vì thế thao tác idempotent một cách tự nhiên — gọi lại trên assignment đã INACTIVE vẫn trả
        204 và KHÔNG phát thêm sự kiện `RoleAssignment.Revoked` thứ hai; không cần `Idempotency-Key`
        và endpoint không nhận header đó. Assignment không tồn tại hoặc thuộc tenant khác trả cùng
        404 `ROLE_ASSIGNMENT_NOT_FOUND`, nên không dò được id xuyên tenant. Không có body trong cả
        request lẫn response.
      operationId: api_010_delete_v1_role_assignments_roleassignmentid
      x-api-id: "API-010"
      x-implementation-status: implemented
      x-permission: "roleAssignment.revoke"
      x-data-scope: "tenant của người gọi; hàng ngoài tenant là 404"
      x-idempotency: "naturally idempotent; không dùng Idempotency-Key — đổi trạng thái, không xóa"
      x-related-requirements: ["FR-148"]
      x-related-data: ["DB-007"]
      x-related-security: ["SEC-104", "SEC-118"]
      x-error-codes: ["ROLE_ASSIGNMENT_NOT_FOUND", "PERMISSION_DENIED"]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
      responses:
        '204':
          description: "Assignment chuyển sang INACTIVE; hàng và lịch sử được giữ nguyên"
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
