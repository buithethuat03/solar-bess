        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: objectType
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 80}
        - name: objectId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: actorId
