    post:
      tags: ["Document Control"]
      summary: "Finalize hash/scan và tạo revision an toàn"
      description: >-
        Server đọc lại bytes từ quarantine, tự băm SHA-256 (SEC-120) rồi giao cho trình quét quyết
        định. Ba kết cục: CLEAN promote object sang release bucket, xóa bản quarantine, ghi
        `contentHash`/`sizeBytes` và trả 200; INFECTED lưu `scanSignature`, hủy object quarantine,
        không bao giờ ghi hash và trả 200 với revision không thể phát hành; UNAVAILABLE giữ nguyên
        bytes trong quarantine, đánh dấu `scanStatus = UNAVAILABLE` và trả 503 `SCANNER_UNAVAILABLE`
        với `retryable: true` để có thể quét lại bằng một `Idempotency-Key` mới. Không có nhánh nào
        coi bytes chưa quét hoặc trình quét không liên hệ được là sạch. Upload session ngoài tenant
        hoặc ngoài scope trả 404 `DOCUMENT_REVISION_NOT_FOUND` chứ không phải 403; session không còn
        chờ quét trả 422 `INVALID_STATE_TRANSITION`.
