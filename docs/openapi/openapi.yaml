        state: {$ref: '#/components/schemas/WorkflowInstanceState'}
        currentStepKey: {type: [string, 'null'], maxLength: 80}
        currentAttemptNo: {type: integer, minimum: 1}
        routeHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        requestedBy: {type: string, format: uuid}
        escalationCount:
          type: integer
          minimum: 1
          description: Tăng đơn điệu; cũng là aggregateVersion của sự kiện outbox tương ứng
        lastEscalatedAt: {type: string, format: date-time}
        closedBy: {type: [string, 'null'], format: uuid}
        closedAt: {type: [string, 'null'], format: date-time}
        closureReason: {type: [string, 'null'], maxLength: 2000}
        versionNo:
          type: integer
          minimum: 1
          description: KHÔNG tăng khi leo thang, để expectedVersion của một quyết định đang mở vẫn hợp lệ
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    WorkflowEscalationResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/WorkflowEscalationView'}
        correlationId: {type: string}
      additionalProperties: false
    SearchResultType:
      type: string
      enum: [PROJECT, DOCUMENT, RISK, ISSUE, CHANGE_REQUEST, CONTRACT]
      description: Chỉ các register đã triển khai; mỗi giá trị là một nhánh UNION ALL riêng có scope riêng
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 200
          description: Mã khớp theo tiền tố, tiêu đề khớp theo chuỗi con; ký tự đại diện được escape
        types:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: {$ref: '#/components/schemas/SearchResultType'}
          description: Bỏ trống thì tìm mọi register mà người gọi đọc được
        limit: {type: integer, minimum: 1, maximum: 50, default: 20}
      additionalProperties: false
    SearchResultRow:
      type: object
      description: >-
        Chỉ các cột định danh của register rời khỏi cơ sở dữ liệu — không nội dung tệp, không
        snippet, không OCR.
      required: [type, id, code, title, projectId]
      properties:
        type: {$ref: '#/components/schemas/SearchResultType'}
        id: {type: string, format: uuid}
        code: {type: string, minLength: 1, maxLength: 120}
        title: {type: string, maxLength: 400}
        projectId: {type: string, format: uuid}
      additionalProperties: false
    SearchPageMeta:
      type: object
      description: Không có nextCursor — `limit` chặn cứng kích thước một lượt tìm
      required: [limit]
      properties:
        limit: {type: integer, minimum: 1, maximum: 50}
      additionalProperties: false
    SearchResponse:
      type: object
      required: [data, meta, correlationId]
      properties:
        data:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/SearchResultRow'}
        meta: {$ref: '#/components/schemas/SearchPageMeta'}
        correlationId: {type: string}
      additionalProperties: false
    SavedViewTargetType:
      type: string
      enum: [PROJECT, DOCUMENT, RISK, ISSUE, CHANGE_REQUEST, CONTRACT]
      description: Chỉ các register đã có endpoint truy vấn; target không truy vấn được sẽ là tham chiếu treo
    SavedViewShareScope:
      type: string
      enum: [PRIVATE]
      description: >-
        V1 cố ý chỉ biết đúng một share scope. Mọi giá trị khác bị API-132 từ chối 422
        SHARE_SCOPE_NOT_SUPPORTED, nên một saved view không thể nâng quyền của ai theo cấu trúc.
    SearchReportingPageMeta:
      type: object
      required: [nextCursor, limit]
      properties:
        nextCursor: {type: [string, 'null'], maxLength: 500}
        limit: {type: integer, minimum: 1, maximum: 100}
      additionalProperties: false
    SavedView:
      type: object
      description: DB-096 saved view; chỉ lưu trạng thái trình bày, không bao giờ lưu quyền
      required: [id, name, targetType, filterSnapshot, columnSnapshot, sortSnapshot, shareScope, versionNo, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        targetType: {$ref: '#/components/schemas/SavedViewTargetType'}
        filterSnapshot: {type: object, additionalProperties: true}
        columnSnapshot:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 100}
        sortSnapshot:
          type: array
          maxItems: 20
          items: {type: object, additionalProperties: true}
        shareScope: {$ref: '#/components/schemas/SavedViewShareScope'}
        versionNo: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    CreateSavedViewRequest:
      type: object
      description: "Không có `ownerUserId`: chủ sở hữu luôn là người gọi"
      required: [name, targetType]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        targetType: {$ref: '#/components/schemas/SavedViewTargetType'}
        filterSnapshot: {type: object, additionalProperties: true}
        columnSnapshot:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 100}
        sortSnapshot:
          type: array
          maxItems: 20
          items: {type: object, additionalProperties: true}
        shareScope:
          type: string
          maxLength: 40
          description: >-
            Nhận như văn bản tự do có chủ đích: mọi giá trị khác PRIVATE nổi lên thành 422
            SHARE_SCOPE_NOT_SUPPORTED thay vì chìm trong một lỗi validation vô danh.
      additionalProperties: false
    SavedViewListResponse:
      type: object
      required: [data, meta, correlationId]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SavedView'}
        meta: {$ref: '#/components/schemas/SearchReportingPageMeta'}
        correlationId: {type: string}
      additionalProperties: false
    SavedViewCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/SavedView'}
        correlationId: {type: string}
      additionalProperties: false
    ReportType:
      type: string
      enum: [RISK_REGISTER_CSV, DOCUMENT_REGISTER_CSV]
      description: >-
        Allowlist FR-173; mỗi giá trị ánh xạ tới đúng một register đã triển khai và một permission
        đọc (riskChange.read / document.read).
    ReportJobStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED]
    CreateReportJobRequest:
      type: object
      required: [reportType, projectId]
      properties:
        reportType: {$ref: '#/components/schemas/ReportType'}
        projectId: {type: string, format: uuid}
      additionalProperties: false
    ReportJobDownloadRef:
      type: object
      description: >-
        KHOẢNG TRỐNG ĐƯỢC GHI NHẬN: không phải presigned URL. Bản dựng này chưa cài gói presigner
        S3, nên client nhận tham chiếu đối tượng ổn định và tải qua hạ tầng tự xác thực được với
        object store.
      required: [bucket, objectKey]
      properties:
        bucket: {type: string, minLength: 1, maxLength: 200}
        objectKey: {type: string, minLength: 1, maxLength: 500}
      additionalProperties: false
    ReportJob:
      type: object
      description: DB-097 report job; nội dung được worker sinh ra phía server
      required: [id, reportType, filterSnapshot, status, dataAsOf, errorCode, expiresAt, requestedBy, correlationId, createdAt, updatedAt, download]
      properties:
        id: {type: string, format: uuid}
        reportType: {$ref: '#/components/schemas/ReportType'}
        filterSnapshot: {type: object, additionalProperties: true}
        status: {$ref: '#/components/schemas/ReportJobStatus'}
        dataAsOf: {type: [string, 'null'], format: date-time}
        errorCode: {type: [string, 'null'], maxLength: 80}
        expiresAt: {type: [string, 'null'], format: date-time}
        requestedBy: {type: string, format: uuid, description: Chỉ chính người này đọc được job}
        correlationId: {type: string, minLength: 1, maxLength: 100}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        download:
          anyOf:
            - {$ref: '#/components/schemas/ReportJobDownloadRef'}
            - {type: 'null'}
          description: >-
            Chỉ khác null khi job COMPLETED, chưa hết hạn, VÀ quyền đọc register đích còn hiệu lực
            tại thời điểm đọc.
      additionalProperties: false
    ReportJobResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/ReportJob'}
        correlationId: {type: string}
      additionalProperties: false
  responses:
    Error400:
      description: "Invalid request"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: "Authentication required"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: "Denied by policy"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: "Tenant-scoped resource not found"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: "State, version or idempotency conflict"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: "Domain validation or quarantine"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: "Rate limited"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: "Opaque internal error"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: >-
        Một dependency bắt buộc đang không sẵn sàng nên lệnh chưa thể hoàn tất, nhưng không có gì bị
        ghi sai: người gọi thử lại được. Trường hợp duy nhất hiện nay là ADR-005 malware scanner —
        khi clamd không trả lời, verdict được ghi bền là `UNAVAILABLE`, bytes tiếp tục nằm trong
        quarantine và revision không bao giờ được phát hành, thay vì bị coi là sạch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
