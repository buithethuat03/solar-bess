      enum: [QUARANTINED, SCANNING, CLEAN, INFECTED, UNAVAILABLE]
      description: >-
        Bytes bắt đầu ở QUARANTINED. UNAVAILABLE là trạng thái riêng biệt với INFECTED: trình quét
        mất liên lạc phải giữ revision lại, không bao giờ được release và không bao giờ được coi là
