      type: string
      enum: [DRAFT, READY, SUBMITTED, SIGNED, HANDED_OVER]
      description: >-
        API-105 sinh SUBMITTED, rồi SIGNED, rồi HANDED_OVER. Hồ sơ SIGNED chỉ còn hai nước đi:
        handover đẩy sang HANDED_OVER, và đặt legal hold — gỡ hold luôn bị trigger từ chối.
