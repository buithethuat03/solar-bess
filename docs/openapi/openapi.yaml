        master ref kiểm trong tenant, dự án sinh ra INITIATION/DRAFT kèm site chính bắt buộc, cùng
        cách trim/mặc định, cùng sự kiện PROJECT_CREATED. Idempotency được neo bằng CẤU TRÚC: partial
        unique index trên `projects.source_opportunity_id` bảo đảm mỗi cơ hội chỉ sinh ra đúng một
        dự án, và khóa hàng trên opportunity xếp hàng các lệnh song song; gọi lại trả về CHÍNH dự án
        đã có với `alreadyConverted: true` (vẫn trong khung 201) thay vì tạo dự án thứ hai. Điều
        kiện: stage APPROVED, hoặc tồn tại một scenario có status APPROVED theo projection đọc-thời-
        điểm (422 `INVALID_STAGE_TRANSITION` nếu không). Khách hàng của dự án phải đúng khách hàng
        của cơ hội (422 `CUSTOMER_COMPANY_MISMATCH`) và bắt buộc phải có (422
        `CUSTOMER_COMPANY_REQUIRED`) khi cơ hội chưa mang. Portfolio/pháp nhân/company/PM phải thuộc
        tenant (422). Trùng mã dự án trả 409 `PROJECT_CODE_CONFLICT` và cơ hội KHÔNG bị đụng tới.
