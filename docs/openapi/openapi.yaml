        updatedAt: {type: string, format: date-time}
        opportunityStage: {$ref: '#/components/schemas/OpportunityStage'}
      additionalProperties: false
    CreateSurveyPackageRequest:
      type: object
      properties:
        dataQuality: {$ref: '#/components/schemas/SurveyDataQuality'}
        documentRefs:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 500}
          description: Chỉ tham chiếu tài liệu mờ; endpoint không nhận nội dung tệp
        notes: {type: string, minLength: 1, maxLength: 4000}
      additionalProperties: false
    InvestmentScenario:
      type: object
      description: >-
        DB-016. Server KHÔNG tính bất kỳ con số tài chính nào: các trường tiền và suất sinh lợi là
        bằng chứng do client cung cấp, lưu nguyên văn cùng formulaVersion, dạng chuỗi numeric.
      required: [id, opportunityId, scenarioType, version, status, currency, capexTotal, npv, irr, paybackMonths, inputSnapshot, outputSnapshot, formulaVersion, workflowInstanceId, submittedBy, submittedAt, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        opportunityId: {type: string, format: uuid}
        scenarioType: {$ref: '#/components/schemas/InvestmentScenarioType'}
        version: {type: integer, minimum: 1, description: "MAX + 1 theo từng scenarioType, cấp trong transaction"}
        status: {$ref: '#/components/schemas/InvestmentScenarioStatus'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        capexTotal: {type: [string, 'null'], pattern: '^\d{1,15}(\.\d{1,4})?$'}
        npv:
          type: [string, 'null']
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          description: numeric(19,4) CÓ DẤU — NPV âm là hợp lệ
        irr:
          type: [string, 'null']
          pattern: '^-?\d{1,3}(\.\d{1,6})?$'
          description: numeric(9,6) có dấu dạng chuỗi
        paybackMonths: {type: ['integer', 'null'], minimum: 0}
        inputSnapshot: {type: object, additionalProperties: true}
        outputSnapshot: {type: object, additionalProperties: true}
        formulaVersion: {type: string, minLength: 1, maxLength: 40}
        workflowInstanceId:
          type: [string, 'null']
          format: uuid
          description: >-
            Luôn null trong V1: workflow_instances.project_id là NOT NULL nên engine không thể chứa
            một target tiền-dự-án (điểm dừng trung thực của API-032).
        submittedBy: {type: [string, 'null'], format: uuid}
        submittedAt: {type: [string, 'null'], format: date-time}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    InvestmentScenarioCommandView:
      type: object
      description: Scenario sau lệnh, kèm stage của opportunity SAU lệnh
      required: [id, opportunityId, scenarioType, version, status, currency, capexTotal, npv, irr, paybackMonths, inputSnapshot, outputSnapshot, formulaVersion, workflowInstanceId, submittedBy, submittedAt, versionNo, createdBy, updatedBy, createdAt, updatedAt, opportunityStage]
      properties:
        id: {type: string, format: uuid}
        opportunityId: {type: string, format: uuid}
        scenarioType: {$ref: '#/components/schemas/InvestmentScenarioType'}
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/InvestmentScenarioStatus'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        capexTotal: {type: [string, 'null'], pattern: '^\d{1,15}(\.\d{1,4})?$'}
        npv: {type: [string, 'null'], pattern: '^-?\d{1,15}(\.\d{1,4})?$'}
        irr: {type: [string, 'null'], pattern: '^-?\d{1,3}(\.\d{1,6})?$'}
        paybackMonths: {type: ['integer', 'null'], minimum: 0}
        inputSnapshot: {type: object, additionalProperties: true}
        outputSnapshot: {type: object, additionalProperties: true}
        formulaVersion: {type: string, minLength: 1, maxLength: 40}
        workflowInstanceId: {type: [string, 'null'], format: uuid}
        submittedBy: {type: [string, 'null'], format: uuid}
        submittedAt: {type: [string, 'null'], format: date-time}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        opportunityStage: {$ref: '#/components/schemas/OpportunityStage'}
      additionalProperties: false
    InvestmentScenarioProjection:
      type: object
