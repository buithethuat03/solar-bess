        signedBy: {type: [string, 'null'], format: uuid}
        signedAt: {type: [string, 'null'], format: date-time}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    CreateDailyLogRequest:
      type: object
      description: >-
        Có `correctionOfId` thì đây là luồng đính chính: các cột định danh ô được sao chép từ bản
        gốc đã SIGNED, `reason` trở thành bắt buộc, và `siteId`/`contractorCompanyId`/`logDate`/
        `shift` gửi kèm sẽ bị bỏ qua vì bản đính chính phải nằm đúng ô của bản gốc.
      required: [siteId, contractorCompanyId, logDate, shift, summary]
      properties:
        siteId: {type: string, format: uuid}
        contractorCompanyId: {type: string, format: uuid}
        logDate: {type: string, format: date}
        shift: {$ref: '#/components/schemas/DailyLogShift'}
        summary: {type: string, minLength: 3, maxLength: 4000}
        details: {type: object, additionalProperties: true}
        correctionOfId: {type: string, format: uuid, description: Chỉ log đã SIGNED mới được đính chính}
        reason: {type: string, minLength: 3, maxLength: 2000, description: Bắt buộc khi có correctionOfId}
      additionalProperties: false
