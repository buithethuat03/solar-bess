          description: Phải ở tương lai, nếu không trả 422 SHARE_EXPIRY_INVALID
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/DocumentRecipient'}
        watermarkRequired: {type: boolean, default: true, description: AC-089 giữ watermark bật trừ khi có người tắt rõ ràng}
        downloadAllowed: {type: boolean, default: false, description: AC-089 giữ download tắt trừ khi có người bật rõ ràng}
      additionalProperties: false
    StartSignatureEnvelopeRequest:
      type: object
      required: [provider, signers]
      properties:
        provider:
          type: string
          minLength: 2
          maxLength: 80
          description: Chỉ ghi nhận nhà cung cấp dự kiến; không có lời gọi ra ngoài nào được thực hiện
        signers:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/DocumentSigner'}
      additionalProperties: false
    DocumentListResponse:
