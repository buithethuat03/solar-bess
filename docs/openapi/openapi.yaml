        ISSUED mà `currentRevisionId` trỏ tới, `latestRevision` là revision mới nhất theo
        `(createdAt, id)` bất kể trạng thái. `latestRevision` là trường duy nhất làm lộ một bản upload
        INFECTED hoặc còn quarantine, vì các bản đó chưa bao giờ được ISSUED nên `currentRevisionId`
