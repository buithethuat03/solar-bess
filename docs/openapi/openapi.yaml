        status: {$ref: '#/components/schemas/CodGateStatus'}
        evidenceRefs:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 500}
        evidenceExpiry:
          type: [string, 'null']
          format: date
          description: AC-059 — bằng chứng hết hiệu lực thì gate không còn thỏa mãn điều gì
        acceptedBy: {type: [string, 'null'], format: uuid}
        acceptedAt: {type: [string, 'null'], format: date-time}
        waivedBy: {type: [string, 'null'], format: uuid}
        waivedAt: {type: [string, 'null'], format: date-time}
        waiverReason: {type: [string, 'null'], maxLength: 2000}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    CodGateReviewCycle:
      type: object
      description: >-
        DB-118 một vòng thẩm tra. `SUBMIT` mở vòng, `DECIDE` đóng vòng; người quyết định không bao
        giờ là người nộp (`ck_cod_gate_review_cycle_sod`) và một vòng đã quyết định bị đóng băng.
      required: [id, codGateId, sequenceNo, evidenceRefs, evidenceExpiry, submissionComment, submittedBy, submittedAt, decision, decisionComment, decidedBy, decidedAt]
      properties:
        id: {type: string, format: uuid}
        codGateId: {type: string, format: uuid}
        sequenceNo: {type: integer, minimum: 1}
        evidenceRefs:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 500}
        evidenceExpiry: {type: [string, 'null'], format: date}
        submissionComment: {type: string, minLength: 3, maxLength: 2000}
        submittedBy: {type: string, format: uuid}
        submittedAt: {type: string, format: date-time}
        decision:
          anyOf:
            - {$ref: '#/components/schemas/CodGateReviewDecision'}
            - {type: 'null'}
        decisionComment: {type: [string, 'null'], maxLength: 2000}
        decidedBy: {type: [string, 'null'], format: uuid}
        decidedAt: {type: [string, 'null'], format: date-time}
      additionalProperties: false
    CodGateCounts:
      type: object
      required: [total, accepted, waived, pending, underReview, rejected, mandatoryTotal, mandatoryOutstanding]
      properties:
        total: {type: integer, minimum: 0}
        accepted: {type: integer, minimum: 0}
        waived: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        underReview: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        mandatoryTotal: {type: integer, minimum: 0}
        mandatoryOutstanding:
          type: integer
          minimum: 0
          description: Lớn hơn 0 thì SIGN_COD bị từ chối 422 GATE_BLOCKED
      additionalProperties: false
    CodCategoryReadiness:
      type: object
      required: [category, total, satisfied, outstanding]
      properties:
        category: {$ref: '#/components/schemas/CodGateCategory'}
        total: {type: integer, minimum: 1}
        satisfied:
          type: integer
          minimum: 0
          description: Chỉ đếm gate ACCEPTED/WAIVED mà bằng chứng chưa hết hiệu lực tại asOf
        outstanding: {type: integer, minimum: 0}
      additionalProperties: false
    CodBlockingFinding:
      type: object
      description: >-
        Chỉ id, mã tham chiếu và phân loại — không mô tả punch, không diễn giải NCR, không lý do
        dừng việc; projection này đã được thu hẹp theo đúng tầm với của người gọi.
      required: [type, id, reference, detail]
      properties:
        type:
          type: string
          enum: [PUNCH_ITEM, NCR, STOP_WORK]
        id: {type: string, format: uuid}
        reference: {type: string, minLength: 1, maxLength: 200}
        detail: {type: string, minLength: 1, maxLength: 400}
      additionalProperties: false
    CodBlockingFindings:
      type: object
      required: [punchItems, criticalNcrs, stopWorks, total, items]
      properties:
        punchItems: {type: integer, minimum: 0}
        criticalNcrs: {type: integer, minimum: 0}
        stopWorks:
          type: integer
          minimum: 0
          description: >-
            An toàn hỏng thì đóng — sổ stop-work không đọc được cũng sinh ra một phát hiện chặn tổng
            hợp, không bao giờ là 0.
        total: {type: integer, minimum: 0}
        items:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/CodBlockingFinding'}
      additionalProperties: false
    CodReadinessEvaluation:
      type: object
      description: >-
        Kết quả của một hàm THUẦN trên dữ liệu đã được ủy quyền. Đúng hàm này quyết định readyToSign
        cho SIGN_COD, nên chữ ký không bao giờ bị phán xử bởi một bản luật thứ hai.
      required: [asOf, gates, categories, expiredEvidenceGateIds, blockingFindings, blocked, readyToSign]
      properties:
        asOf: {type: string, format: date-time}
        gates: {$ref: '#/components/schemas/CodGateCounts'}
        categories:
          type: array
          maxItems: 7
          items: {$ref: '#/components/schemas/CodCategoryReadiness'}
        expiredEvidenceGateIds:
          type: array
          maxItems: 1000
          items: {type: string, format: uuid}
        blockingFindings: {$ref: '#/components/schemas/CodBlockingFindings'}
        blocked: {type: boolean, description: true khi còn ít nhất một phát hiện chặn đang mở}
        readyToSign:
          type: boolean
          description: true chỉ khi không có gì chặn VÀ mọi gate bắt buộc đã thỏa mãn với bằng chứng còn hiệu lực
      additionalProperties: false
    CodSignerSnapshot:
      type: object
      description: >-
        Snapshot người ký BẤT BIẾN: id ổn định kèm danh tính tại thời điểm ký và băm canonical của
        đúng thứ được ký — chữ ký không bao giờ chỉ là một chuỗi hiển thị (AGENTS.md §9).
      required: [userId, displayName, email, signedAt, snapshotHash]
      properties:
        userId: {type: string, format: uuid}
        displayName: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, format: email, maxLength: 254}
        signedAt: {type: string, format: date-time}
        snapshotHash: {type: string, pattern: '^[0-9a-f]{64}$'}
      additionalProperties: false
    CodPackage:
      type: object
      description: >-
        DB-077 hồ sơ COD. Một dự án chỉ có một hồ sơ chưa hoàn tất tại một thời điểm
        (`uq_cod_package_active`). Hồ sơ SIGNED chỉ còn hai nước đi: handover, và đặt legal hold.
      required: [id, projectId, version, status, readinessSnapshot, snapshotHash, signedArtifactRef, effectiveAt, legalHold, submittedBy, submittedAt, signedBy, signedAt, signerSnapshot, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/CodPackageStatus'}
        readinessSnapshot:
          type: object
          additionalProperties: true
          description: Đánh giá readiness tại thời điểm trình/ký, trừ mốc đồng hồ — chính là thứ được băm
        snapshotHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        signedArtifactRef: {type: [string, 'null'], maxLength: 500}
        effectiveAt: {type: [string, 'null'], format: date-time}
        legalHold:
          type: boolean
          description: Đặt được trên hồ sơ đã ký; GỠ luôn bị trigger từ chối
        submittedBy: {type: [string, 'null'], format: uuid}
        submittedAt: {type: [string, 'null'], format: date-time}
        signedBy:
          type: [string, 'null']
          format: uuid
          description: Không bao giờ bằng submittedBy; ck_cod_package_sod là chốt chặn
        signedAt: {type: [string, 'null'], format: date-time}
        signerSnapshot:
          anyOf:
            - {$ref: '#/components/schemas/CodSignerSnapshot'}
            - {type: 'null'}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    Handover:
      type: object
      description: DB-078 biên bản bàn giao; một bên nhận chỉ ký nhận đúng một lần và hàng bị đóng băng
      required: [id, projectId, codPackageId, fromPartyId, recipientPartyId, itemManifest, openItems, acceptedBy, acceptedAt, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        codPackageId: {type: string, format: uuid}
        fromPartyId: {type: string, format: uuid}
        recipientPartyId: {type: string, format: uuid, description: Phải khác fromPartyId}
        itemManifest:
          type: array
          maxItems: 500
          items: {type: object, additionalProperties: true}
        openItems:
          type: array
          maxItems: 500
          items: {type: object, additionalProperties: true}
        acceptedBy: {type: [string, 'null'], format: uuid}
        acceptedAt: {type: [string, 'null'], format: date-time}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    CodReadinessView:
      type: object
      required: [projectId, readiness, packages]
      properties:
        projectId: {type: string, format: uuid}
        readiness: {$ref: '#/components/schemas/CodReadinessEvaluation'}
        packages:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/CodPackage'}
          description: Mọi hồ sơ COD của dự án, version giảm dần
      additionalProperties: false
    CodReadinessResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/CodReadinessView'}
        correlationId: {type: string}
      additionalProperties: false
    CodTransitionCommandRequest:
      type: object
      description: >-
        Union ĐÓNG trên `commandType`. DEFINE_GATE cần `category`, `code`, `title`; REVIEW_EVIDENCE
        và WAIVE_GATE cần `codGateId` + `expectedVersion`; SIGN_COD và ACCEPT_HANDOVER cần
        `codPackageId` + `expectedVersion`; SUBMIT_COD không cần tham chiếu nào vì nó TẠO hồ sơ.
        Trường nào bắt buộc cho lệnh nào được service kiểm và trả mã lỗi riêng cho từng trường thiếu.
      required: [commandType]
      properties:
        commandType:
          type: string
          enum: [DEFINE_GATE, REVIEW_EVIDENCE, WAIVE_GATE, SUBMIT_COD, SIGN_COD, ACCEPT_HANDOVER]
        expectedVersion: {type: integer, minimum: 1}
        category: {$ref: '#/components/schemas/CodGateCategory'}
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,79}$', maxLength: 80}
        title: {type: string, minLength: 3, maxLength: 400}
        mandatory: {type: boolean, description: Bỏ trống thì mặc định true}
        waivable: {type: boolean, description: Bỏ trống thì mặc định false}
        ownerUserId: {type: string, format: uuid, description: Bỏ trống thì mặc định là người gọi}
        dueDate: {type: string, format: date}
        codGateId: {type: string, format: uuid}
        reviewAction:
          type: string
          enum: [SUBMIT, DECIDE]
          description: AC-059 là hai hành vi của hai người; SUBMIT mở vòng thẩm tra, DECIDE đóng vòng
        evidenceRefs:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 500}
        evidenceExpiry: {type: string, format: date}
        decision: {$ref: '#/components/schemas/CodGateReviewDecision'}
        reason:
          type: string
          minLength: 3
          maxLength: 2000
          description: Thuyết minh nộp bằng chứng, thuyết minh quyết định, hoặc lý do miễn trừ
        codPackageId: {type: string, format: uuid}
        signedArtifactRef: {type: string, minLength: 1, maxLength: 500}
        effectiveAt: {type: string, format: date-time}
        fromPartyId: {type: string, format: uuid}
        recipientPartyId: {type: string, format: uuid}
        itemManifest:
          type: array
          maxItems: 500
          items: {type: object, additionalProperties: true}
        openItems:
          type: array
          maxItems: 500
          items: {type: object, additionalProperties: true}
      additionalProperties: false
    CodGateCommandResult:
      type: object
      description: >-
        Kết quả của DEFINE_GATE, REVIEW_EVIDENCE và WAIVE_GATE. `reviewCycle` chỉ có mặt với
        REVIEW_EVIDENCE; nó VẮNG MẶT hoàn toàn trong kết quả của DEFINE_GATE và WAIVE_GATE.
      required: [resourceType, resourceId, gate]
      properties:
        resourceType: {type: string, enum: [CodGate]}
        resourceId: {type: string, format: uuid}
        gate: {$ref: '#/components/schemas/CodGate'}
        reviewCycle: {$ref: '#/components/schemas/CodGateReviewCycle'}
      additionalProperties: false
    CodPackageCommandResult:
      type: object
      description: Kết quả của SUBMIT_COD và SIGN_COD, kèm đánh giá readiness mà lệnh đã dùng
      required: [resourceType, resourceId, package, readiness]
      properties:
        resourceType: {type: string, enum: [CodPackage]}
        resourceId: {type: string, format: uuid}
        package: {$ref: '#/components/schemas/CodPackage'}
        readiness: {$ref: '#/components/schemas/CodReadinessEvaluation'}
      additionalProperties: false
    HandoverCommandResult:
      type: object
      description: Kết quả của ACCEPT_HANDOVER; hồ sơ kèm theo đã chuyển sang HANDED_OVER
      required: [resourceType, resourceId, handover, package]
      properties:
        resourceType: {type: string, enum: [Handover]}
        resourceId: {type: string, format: uuid}
        handover: {$ref: '#/components/schemas/Handover'}
        package: {$ref: '#/components/schemas/CodPackage'}
      additionalProperties: false
    CodTransitionCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data:
          oneOf:
            - {$ref: '#/components/schemas/CodGateCommandResult'}
            - {$ref: '#/components/schemas/CodPackageCommandResult'}
            - {$ref: '#/components/schemas/HandoverCommandResult'}
          description: Nhánh nào được trả về do commandType quyết định; resourceType phân biệt chúng
        correlationId: {type: string}
      additionalProperties: false
    OperationsSitePageMeta:
      type: object
      required: [nextCursor, limit, siteId]
      properties:
        nextCursor: {type: [string, 'null'], maxLength: 500}
        limit: {type: integer, minimum: 1, maximum: 100}
        siteId: {type: string, format: uuid}
      additionalProperties: false
    OperationsAssetPageMeta:
      type: object
      required: [nextCursor, limit, assetId, siteId]
      properties:
        nextCursor: {type: [string, 'null'], maxLength: 500}
        limit: {type: integer, minimum: 1, maximum: 100}
        assetId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
      additionalProperties: false
    AlarmCaseSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    AlarmCaseState:
      type: string
      enum: [OPEN, ACKNOWLEDGED, INVESTIGATING, RESOLVED, CLOSED, REOPENED]
      description: >-
        Mọi giá trị chỉ mô tả trạng thái của case CỤC BỘ. Không giá trị nào ở đây có ý nghĩa trong
        nguồn OT: xác nhận, xử lý hay đóng một case không bao giờ clear, reset hay suppress alarm gốc.
    ServiceIncidentSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    ServiceIncidentStatus:
      type: string
      enum: [OPEN, INVESTIGATING, MITIGATED, RESOLVED, CLOSED]
      description: API-117 chỉ tạo OPEN; catalog chưa có operation chuyển trạng thái sự cố dịch vụ
    WorkOrderStatus:
      type: string
      enum: [DRAFT, APPROVED, SCHEDULED, DISPATCHED, IN_PROGRESS, ON_HOLD, COMPLETE, VERIFIED, CLOSED, REOPENED, CANCELLED]
      description: >-
        APPROVED là giá trị hợp lệ mà KHÔNG operation nào trong catalog ghi được — không có
        operation approve hay schedule — nên API-119 dừng ở DRAFT/SCHEDULED và DISPATCH nhận mọi
        trạng thái trước điều phối. Ghi nhận, không phải bỏ sót.
    WorkOrderPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    WorkOrderClosureDecision:
      type: string
      enum: [APPROVE, RETURN]
    WarrantyClaimStatus:
      type: string
      enum: [SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, WITHDRAWN]
      description: API-120 chỉ tạo SUBMITTED; một yêu cầu đã kết luận bị trigger đóng băng
    MaintenancePlanTriggerType:
      type: string
      enum: [TIME, USAGE, CONDITION]
      description: >-
        Assumption (owner Product Owner, xác nhận trước khi slice lập kế hoạch O&M ship): DB-087 nêu
        triggerType mà không kèm danh sách giá trị.
    MaintenancePlanStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]
    AssetOperationalStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, ARCHIVED]
    AlarmCase:
      type: object
      description: >-
        DB-084 case CỤC BỘ mở cho một hoặc nhiều sự kiện alarm OT. `sourceEventRefs` là các id LOGIC
        vào kho sự kiện DB-092 — không có payload, tag, gateway, endpoint hay credential nào được
        lưu, nên không có gì thuộc loại đó serialize được ra đây (SEC-127/SEC-128).
      required: [id, projectId, siteId, assetId, severity, state, ownerId, firstSeenAt, lastSeenAt, sourceEventRefs, sourceQuality, acknowledgedBy, acknowledgedAt, acknowledgmentNote, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        assetId: {type: [string, 'null'], format: uuid}
        severity: {$ref: '#/components/schemas/AlarmCaseSeverity'}
        state: {$ref: '#/components/schemas/AlarmCaseState'}
        ownerId: {type: [string, 'null'], format: uuid}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        sourceEventRefs:
          type: array
          maxItems: 1000
          items: {type: string, minLength: 1, maxLength: 200}
        sourceQuality:
          type: [string, 'null']
          maxLength: 20
          description: >-
            Chép nguyên văn từ projection DB-092. Từ vựng do hợp đồng gateway OT sở hữu, không phải
            PM Web, nên CỐ Ý không có enum — Open Question cho chủ sở hữu gateway OT.
        acknowledgedBy: {type: [string, 'null'], format: uuid}
        acknowledgedAt: {type: [string, 'null'], format: date-time}
        acknowledgmentNote: {type: [string, 'null'], maxLength: 2000}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    AlarmCaseListResponse:
      type: object
      required: [data, meta, correlationId]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AlarmCase'}
        meta: {$ref: '#/components/schemas/OperationsSitePageMeta'}
        correlationId: {type: string}
      additionalProperties: false
    AcknowledgeAlarmCaseRequest:
      type: object
      description: >-
        CỐ Ý không có trường nào mô tả được một hành động phía nguồn: không clear, không reset,
        không suppress, không source event id, không đích xác nhận. Chỉ có khóa lạc quan và một ghi
        chú cục bộ (SEC-127/SEC-128).
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        note: {type: string, minLength: 3, maxLength: 2000}
      additionalProperties: false
    AlarmCaseAcknowledgementView:
      type: object
      description: >-
        Case cục bộ sau lệnh. `acknowledgementApplied: false` nghĩa là case đã được xác nhận từ
        trước và lệnh này là NO-OP — không tăng versionNo, không sinh vết audit thứ hai.
      required: [id, projectId, siteId, assetId, severity, state, ownerId, firstSeenAt, lastSeenAt, sourceEventRefs, sourceQuality, acknowledgedBy, acknowledgedAt, acknowledgmentNote, versionNo, createdBy, updatedBy, createdAt, updatedAt, acknowledgementApplied]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        assetId: {type: [string, 'null'], format: uuid}
        severity: {$ref: '#/components/schemas/AlarmCaseSeverity'}
        state: {$ref: '#/components/schemas/AlarmCaseState'}
        ownerId: {type: [string, 'null'], format: uuid}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        sourceEventRefs:
          type: array
          maxItems: 1000
          items: {type: string, minLength: 1, maxLength: 200}
        sourceQuality: {type: [string, 'null'], maxLength: 20}
        acknowledgedBy: {type: [string, 'null'], format: uuid}
        acknowledgedAt: {type: [string, 'null'], format: date-time}
        acknowledgmentNote: {type: [string, 'null'], maxLength: 2000}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        acknowledgementApplied: {type: boolean}
      additionalProperties: false
    AlarmCaseCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/AlarmCaseAcknowledgementView'}
        correlationId: {type: string}
      additionalProperties: false
    ServiceIncident:
      type: object
      description: DB-085 sự cố dịch vụ kèm đồng hồ SLA; các mốc SLA là dữ liệu ghi trên hàng
      required: [id, projectId, siteId, assetId, alarmCaseId, hseIncidentId, severity, status, title, description, detectedAt, downtimeStart, downtimeEnd, slaResponseDueAt, slaRespondedAt, slaResolutionDueAt, slaResolvedAt, resolutionSummary, reportedBy, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        assetId: {type: [string, 'null'], format: uuid}
        alarmCaseId: {type: [string, 'null'], format: uuid}
        hseIncidentId: {type: [string, 'null'], format: uuid}
        severity: {$ref: '#/components/schemas/ServiceIncidentSeverity'}
        status: {$ref: '#/components/schemas/ServiceIncidentStatus'}
        title: {type: string, minLength: 3, maxLength: 400}
        description: {type: [string, 'null'], maxLength: 4000}
