        API-091 tạo REQUESTED và API-092 chuyển sang ISSUED. Các chuyển tiếp còn lại
        (ACTIVE/SUSPENDED/EXPIRED/CLOSED) chưa có operation nào trong catalog.
    HseIncidentStatus:
      type: string
      enum: [REPORTED, INVESTIGATING, CLOSED]
