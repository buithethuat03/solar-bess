      description: >-
        Một endpoint đa hợp trên `commandType`, luôn trả 200 kèm tài nguyên kết quả và `versionNo`
        của nó. `RAISE` mở NCR mới ở OPEN (trùng mã trong dự án trả 409 `NCR_CODE_CONFLICT`); mọi
        lệnh còn lại bắt buộc `ncrId` và `expectedVersion` (422 `NCR_REFERENCE_REQUIRED`, lệch
        phiên bản trả 409 `VERSION_CONFLICT`). Máy trạng thái FR-094 nằm trong dữ liệu, không rải
        trong các nhánh `if`: lệnh không hợp lệ từ trạng thái hiện tại trả 422
        `INVALID_STATE_TRANSITION`. Các luật độc lập được kiểm ở service VÀ chốt lại bằng constraint
        của cơ sở dữ liệu: người lập NCR không tự phê duyệt disposition, người đề xuất disposition
        không tự quyết định vòng đề xuất, người phụ trách NCR không tự xác nhận đóng, người phụ
        trách CAPA không tự xác nhận hiệu quả — tất cả trả 422 `SOD_CONFLICT`. Đóng NCR bắt buộc có
        ít nhất một bằng chứng (422 `EVIDENCE_REQUIRED`). Một NCR chỉ có một vòng disposition đang
        mở (409 `DISPOSITION_CYCLE_OPEN`); quyết định khi không có vòng nào đang chờ trả 422
        `NO_OPEN_CYCLE`. Dự án ngoài tầm với trả 404 `PROJECT_NOT_FOUND`; NCR/CAPA không thuộc dự án
        này trả 404 `NCR_NOT_FOUND` / `CAPA_NOT_FOUND`.
