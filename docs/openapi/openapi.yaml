          description: Toàn bộ parties của hợp đồng theo thứ tự tạo, không phân trang
        appendices:
          type: array
          items: {$ref: '#/components/schemas/ContractAppendix'}
          description: Toàn bộ appendices ở mọi trạng thái theo thứ tự tạo, không phân trang
        correlationId: {type: string}
      additionalProperties: false
    ContractPartyCommandResponse:
      type: object
      required: [data, correlationId]
