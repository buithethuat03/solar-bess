      required: [id, code, name, type, phase, recordStatus, portfolioId, ownerLegalEntityId, customerCompanyId, projectManagerId, contractModel, currency, plannedCod, forecastCod, sourceOpportunityId, versionNo, sites, opportunityId, alreadyConverted]
      properties:
