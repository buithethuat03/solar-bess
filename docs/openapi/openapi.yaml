  "/v1/search":
    post:
      tags: ["Search & Reporting"]
      summary: "Tìm kiếm quan hệ, ACL theo từng nhánh module"
      description: >-
        POST với ngữ nghĩa thân-an-toàn: đây là một PHÉP ĐỌC, không phải lệnh — không ghi gì, không
        cần và không nhận `Idempotency-Key`. Tìm kiếm là THUẦN QUAN HỆ: một câu SQL, mỗi register
        một nhánh UNION ALL, mỗi nhánh mang ĐÚNG mệnh đề scope mà endpoint danh sách của module đó
        cưỡng chế, nên phân quyền được quyết trong chính câu truy vấn. Thiếu quyền đọc của một
        module thì nhánh đó bị bỏ khỏi câu SQL và đơn giản là không có kết quả — tìm kiếm không bao
        giờ biến phân quyền thành một máy dò; không nhánh nào được phép thì trả trang rỗng, không
        phải 403. Contract cố ý chỉ nhận tầm với tenant-wide hoặc project (package scope không cho
        gì), đúng như ContractCostService. KHÔNG có full-text index, KHÔNG OCR, KHÔNG đọc nội dung
        tệp và KHÔNG có snippet: mã được so khớp theo tiền tố còn tiêu đề theo chuỗi con với ký tự
        đại diện đã được escape, và chỉ các cột định danh {type, id, code, title, projectId} rời
        khỏi cơ sở dữ liệu. Không có `nextCursor` — `limit` chặn cứng kích thước một lượt tìm. Câu
        truy vấn ngắn hơn 2 ký tự là lỗi validation 400.
      operationId: api_130_post_v1_search
      x-api-id: "API-130"
      x-implementation-status: implemented
      x-permission: "search.execute; mỗi nhánh còn cần quyền đọc của module tương ứng"
      x-data-scope: "ACL theo từng nhánh module trong cùng câu SQL; thiếu quyền là nhánh rỗng"
      x-idempotency: "safe-body; không ghi gì, không dùng Idempotency-Key"
      x-related-requirements: ["FR-171"]
      x-related-data: ["DB-010", "DB-020", "DB-022", "DB-023", "DB-026", "DB-028"]
      x-related-security: ["SEC-107", "SEC-112", "SEC-119"]
      x-error-codes: ["PERMISSION_DENIED"]
