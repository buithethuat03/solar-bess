  "/v1/work-orders/{workOrderId}/actions":
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: ["O&M"]
      summary: "Dispatch/start/complete/verify/close và warranty-claim action theo state/authority"
      description: >-
        LỆNH HỢP ĐÓNG trên `commandType`: `DISPATCH`, `START`, `HOLD`, `RESUME`, `COMPLETE`,
        `VERIFY`, `CLOSE`, `REOPEN`, `CANCEL`, `RAISE_WARRANTY_CLAIM`. Giá trị ngoài danh sách bị
        chặn ở tầng validate với 400 và không bao giờ tới service; từ-trạng-thái sai cho lệnh tương
        ứng trả 422 `INVALID_STATE_TRANSITION`.
        KHÔNG AI ĐƯỢC TỰ NGHIỆM THU VIỆC CỦA MÌNH: `VERIFY` và `CLOSE` đòi người thực hiện KHÁC
        người được giao và KHÁC người ghi hoàn thành (422 `SOD_CONFLICT`), và
        `ck_work_order_verifier_independent` lặp lại đúng luật đó trong cơ sở dữ liệu nên một lệnh
        SQL trực tiếp cũng hỏng y như một lời gọi API (SEC-108/SEC-109, WF-024).
        `START` đòi một permit to work còn hiệu lực, TRONG cửa sổ thời hạn và thuộc ĐÚNG SITE của
        work order khi công việc khai `requiresPermit`; mọi kiểu không hợp lệ trả 422
        `PTW_NOT_VALID` và không có gì được ghi — đây chính là khe giữa dispatch và start mà cổng
        này sinh ra để chặn. `COMPLETE` đòi mô tả công việc và ít nhất một bằng chứng, đồng thời mở
        chu kỳ nghiệm thu DB-119. `CLOSE` đòi một tham chiếu bàn giao trở lại vận hành (422
        `RETURN_TO_SERVICE_REQUIRED`, chốt chặn `ck_work_order_closed`): "đã đóng" không được phép
        có nghĩa là "bỏ đi".
        `REOPEN` NỐI THÊM một chu kỳ nghiệm thu mới thay vì ghi đè lần xác nhận trước: quyết định
        cũ, người quyết định và bằng chứng của nó vẫn nằm nguyên trong hàng DB-119 đã đóng băng, chỉ
        có work order trở lại ngoài trạng thái đã nghiệm thu. `RAISE_WARRANTY_CLAIM` nối một hàng
        DB-088 và KHÔNG mang `warrantyId`: DB-083 cố ý không được tạo, nên yêu cầu bảo hành khóa vào
        asset và work order đã phát hiện hư hỏng.
        `expectedVersion` bắt buộc cho mọi lệnh; lệch trả 409 `VERSION_CONFLICT` kèm
        `currentVersion`. Work order ngoài tenant hoặc ngoài tầm với trả 404 `WORK_ORDER_NOT_FOUND`,
        không phải 403. Mọi nhánh đã commit trả 200 — không bao giờ 202.
      operationId: api_120_post_v1_work_orders_workorderid_actions
      x-api-id: "API-120"
      x-implementation-status: implemented
      x-permission: "workOrder.manage"
      x-data-scope: "dự án của work order là neo ABAC; ngoài scope là 404"
      x-idempotency: "required; expectedVersion bắt buộc; DB-101 command receipt phát lại nguyên trạng"
      x-related-requirements: ["FR-121", "FR-122"]
