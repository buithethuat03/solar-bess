        CHỈ NGƯỜI YÊU CẦU đọc được: job của người khác — kể cả đồng nghiệp có `report.read` — trả
        404 `REPORT_JOB_NOT_FOUND` giống hệt job không tồn tại, vì một báo cáo là lát cắt dữ liệu
        dưới scope của ĐÚNG MỘT người và không bao giờ là kênh chia sẻ. Trường `download` chỉ xuất
