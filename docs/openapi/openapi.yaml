      additionalProperties: false
    ContractAppendixCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/ContractAppendix'}
        correlationId: {type: string}
      additionalProperties: false
    ObligationListResponse:
      type: object
      required: [data, meta, correlationId]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ObligationRegisterRow'}
        meta: {$ref: '#/components/schemas/ContractCostPageMeta'}
        correlationId: {type: string}
      additionalProperties: false
    ObligationCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/Obligation'}
        correlationId: {type: string}
      additionalProperties: false
    CostSummaryResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/CostSummary'}
        correlationId: {type: string}
      additionalProperties: false
    BudgetVersionCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/BudgetVersion'}
        correlationId: {type: string}
      additionalProperties: false
    CommitmentCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/Commitment'}
        correlationId: {type: string}
      additionalProperties: false
    PaymentResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/PaymentWithComponents'}
        correlationId: {type: string}
      additionalProperties: false
    EquipmentModelStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, APPROVED, SUPERSEDED]
      description: >-
        Vòng đời FR-045 đầy đủ, nhưng API-068 chỉ tạo ra DRAFT: catalog chưa có operation approve
        nào (quyết định D2), nên APPROVED/SUPERSEDED chỉ đạt tới bằng seed/migration. Nội dung
        nghiệp vụ của model APPROVED bị trigger đóng băng; lối thoát duy nhất là APPROVED →
        SUPERSEDED kèm supersededById.
    BillOfMaterialsStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, RELEASED, SUPERSEDED]
      description: >-
        Vòng đời FR-046/FR-047 đầy đủ, nhưng API-070 create-and-release nên qua API chỉ quan sát
        được RELEASED và SUPERSEDED. Hàng RELEASED/SUPERSEDED bị trigger
        protect_bill_of_materials_history đóng băng; lối thoát hợp lệ duy nhất khỏi RELEASED là
        cú supersede nguyên tử khi API-070 release version kế tiếp.
    BomLineSubstitutionStatus:
      type: string
      enum: [NONE, PROPOSED, APPROVED, REJECTED]
      description: >-
        FR-050 trên từng dòng BOM. API-071 (substitution) bị HOÃN — bảng của nó chưa được cấp DB
        id — nên V1 mọi dòng luôn NONE; từ vựng ship sẵn để workflow substitution về sau điều
        khiển trường này (quyết định D3).
    PlantStatus:
      type: string
      enum: [DRAFT, RELEASED, SUPERSEDED]
      description: >-
        Vòng đời cấu hình plant dùng chung cho DB-081/DB-082: tối đa một hàng RELEASED mỗi site
        (partial unique index); hàng RELEASED/SUPERSEDED bất biến ngoài đúng cú chuyển RELEASED →
        SUPERSEDED thực hiện nguyên tử trong transaction release version kế tiếp.
    EngineeringPlantsPageMeta:
      type: object
      required: [nextCursor, limit]
      properties:
        nextCursor: {type: [string, 'null'], maxLength: 500}
        limit: {type: integer, minimum: 1, maximum: 100}
      additionalProperties: false
    EquipmentModel:
      type: object
      description: >-
        DB-041 một entry của catalog equipment model tenant-scoped. ratings là tài liệu jsonb tự
        do của kỹ thuật; supersededById chỉ khác null khi status là SUPERSEDED.
      required: [id, manufacturerCompanyId, equipmentClass, manufacturer, model, ratings, specVersion, status, supersededById, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        manufacturerCompanyId: {type: [string, 'null'], format: uuid}
        equipmentClass: {type: string, minLength: 1, maxLength: 100}
        manufacturer: {type: string, minLength: 1, maxLength: 200}
        model: {type: string, minLength: 1, maxLength: 200}
        ratings:
          type: object
          additionalProperties: true
        specVersion: {type: string, minLength: 1, maxLength: 60}
        status: {$ref: '#/components/schemas/EquipmentModelStatus'}
        supersededById: {type: [string, 'null'], format: uuid}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    BomLine:
      type: object
      description: >-
        DB-043 một dòng của BOM version. quantity là chuỗi numeric(19,4) đúng dạng Postgres lưu —
        chính văn bản đã vào canonical snapshotHash; substitutionStatus luôn NONE trong V1
        (API-071 hoãn).
      required: [id, billOfMaterialsId, equipmentModelId, lineNo, itemCode, description, quantity, unit, substitutionStatus, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        billOfMaterialsId: {type: string, format: uuid}
        equipmentModelId: {type: [string, 'null'], format: uuid}
        lineNo: {type: integer, minimum: 1}
        itemCode: {type: string, minLength: 1, maxLength: 80}
        description: {type: [string, 'null'], maxLength: 1000}
        quantity:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: numeric(19,4) dạng chuỗi, luôn lớn hơn 0 theo check của DB
        unit: {type: string, minLength: 1, maxLength: 40}
        substitutionStatus: {$ref: '#/components/schemas/BomLineSubstitutionStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    BillOfMaterialsVersion:
      type: object
      description: >-
        DB-042 một BOM version trong register API-069, kèm lineCount đếm trong SQL. lines chỉ
        khác null cho đúng version được yêu cầu qua linesForVersion và chỉ khi version đó nằm
        trong trang trả về (nhúng page-local có chủ đích).
      required: [id, projectId, designRevisionId, version, status, releasedBy, releasedAt, snapshotHash, versionNo, createdBy, updatedBy, createdAt, updatedAt, lineCount, lines]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        designRevisionId: {type: string, format: uuid}
        version:
          type: integer
          minimum: 1
          description: Cấp trong transaction theo MAX+1 của dự án; duy nhất trong dự án
        status: {$ref: '#/components/schemas/BillOfMaterialsStatus'}
        releasedBy: {type: [string, 'null'], format: uuid}
        releasedAt: {type: [string, 'null'], format: date-time}
        snapshotHash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: Canonical hash của nội dung dòng đúng dạng lưu trữ, theo thứ tự lineNo
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lineCount: {type: integer, minimum: 0}
        lines:
          type: [array, 'null']
          maxItems: 500
          items: {$ref: '#/components/schemas/BomLine'}
      additionalProperties: false
    BillOfMaterialsRelease:
      type: object
      description: >-
        Kết quả API-070: BOM version vừa RELEASED kèm trọn bộ dòng đã ghi (đúng dạng lưu trữ đã
        vào snapshotHash) và supersededBomId — bản release trước bị supersede nguyên tử trong
        cùng transaction, null ở lần release đầu của dự án.
      required: [id, projectId, designRevisionId, version, status, releasedBy, releasedAt, snapshotHash, versionNo, createdBy, updatedBy, createdAt, updatedAt, lineCount, lines, supersededBomId]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        designRevisionId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/BillOfMaterialsStatus'}
        releasedBy: {type: string, format: uuid}
        releasedAt: {type: string, format: date-time}
        snapshotHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lineCount: {type: integer, minimum: 1}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/BomLine'}
        supersededBomId: {type: [string, 'null'], format: uuid}
      additionalProperties: false
    SolarPlant:
      type: object
      description: >-
        DB-081 một configuration version của solar plant trên một site. Công suất là chuỗi
        numeric(19,4) đọc lại từ Postgres; configurationHash là canonical hash của configuration.
      required: [id, projectId, siteId, rootAssetId, dcCapacityKwp, acCapacityKw, configurationVersion, configuration, configurationHash, baselineRef, status, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        rootAssetId: {type: string, format: uuid}
        dcCapacityKwp:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: numeric(19,4) dạng chuỗi, luôn lớn hơn 0 theo check của DB
        acCapacityKw:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: numeric(19,4) dạng chuỗi, luôn lớn hơn 0 theo check của DB
        configurationVersion:
          type: integer
          minimum: 1
          description: Cấp trong transaction theo MAX+1 của site; duy nhất trong site
        configuration:
          type: object
          additionalProperties: true
          description: Snapshot topology trọn vẹn của version này
        configurationHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        baselineRef:
          type: [object, 'null']
          additionalProperties: true
        status: {$ref: '#/components/schemas/PlantStatus'}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    SolarPlantRelease:
      type: object
      description: >-
        Kết quả API-073: hàng cấu hình mới RELEASED kèm supersededPlantId của bản release trước
        (bị supersede nguyên tử trong cùng transaction; null khi site chưa từng có bản release).
      required: [id, projectId, siteId, rootAssetId, dcCapacityKwp, acCapacityKw, configurationVersion, configuration, configurationHash, baselineRef, status, versionNo, createdBy, updatedBy, createdAt, updatedAt, supersededPlantId]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        rootAssetId: {type: string, format: uuid}
        dcCapacityKwp: {type: string, pattern: '^\d{1,15}(\.\d{1,4})?$'}
        acCapacityKw: {type: string, pattern: '^\d{1,15}(\.\d{1,4})?$'}
        configurationVersion: {type: integer, minimum: 1}
        configuration:
          type: object
          additionalProperties: true
        configurationHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        baselineRef:
          type: [object, 'null']
          additionalProperties: true
        status: {$ref: '#/components/schemas/PlantStatus'}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        supersededPlantId: {type: [string, 'null'], format: uuid}
      additionalProperties: false
    SolarPlantReleasedConfiguration:
      type: object
      description: Cấu hình RELEASED hiện hành của site — hàng mang nó có thể khác hàng được địa chỉ
      required: [solarPlantId, configurationVersion, configuration, configurationHash]
      properties:
        solarPlantId: {type: string, format: uuid}
        configurationVersion: {type: integer, minimum: 1}
        configuration:
          type: object
          additionalProperties: true
        configurationHash: {type: string, pattern: '^[0-9a-f]{64}$'}
      additionalProperties: false
    SolarPlantVersionHistoryRow:
      type: object
      required: [id, configurationVersion, status, configurationHash, versionNo, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        configurationVersion: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/PlantStatus'}
        configurationHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        versionNo: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    BessPlant:
      type: object
      description: >-
        DB-082 một hierarchy version của BESS plant. Schema CỐ Ý không có bất kỳ trường kết
        nối/credential nào (SEC-127/SEC-128): PM Web không thể lưu nổi tọa độ của một write path
        OT. kpi và telemetry là null tường minh — không tồn tại telemetry store trong PM Web và
        dữ liệu vận hành chỉ có thể tới read-only qua integration layer.
      required: [id, projectId, siteId, rootAssetId, powerMw, energyMwh, hierarchyVersion, operatingEnvelope, pointListVersion, status, versionNo, createdBy, updatedBy, createdAt, updatedAt, kpi, telemetry]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        rootAssetId: {type: string, format: uuid}
        powerMw:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: numeric(19,4) dạng chuỗi, luôn lớn hơn 0 theo check của DB
        energyMwh:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: numeric(19,4) dạng chuỗi, luôn lớn hơn 0 theo check của DB
        hierarchyVersion: {type: integer, minimum: 1}
        operatingEnvelope:
          type: object
          additionalProperties: true
          description: >-
            Tài liệu ràng buộc kỹ thuật thụ động (power/SOC/ramp bounds) — đầu vào duy nhất của
            mô phỏng advisory API-075, không bao giờ là nguồn setpoint
        pointListVersion: {type: [string, 'null'], maxLength: 60}
        status: {$ref: '#/components/schemas/PlantStatus'}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        kpi:
          type: 'null'
          description: >-
            Luôn null tường minh: PM Web không có telemetry store; KPI vận hành thuộc miền O&M
            và chỉ tới read-only qua integration layer (SEC-127/SEC-128)
        telemetry:
          type: 'null'
          description: >-
            Luôn null tường minh: không tồn tại đường dữ liệu OT nào trong PM Web (ranh giới
            SEC-127/SEC-128)
      additionalProperties: false
    DispatchViolation:
      type: object
      description: >-
        Một ràng buộc envelope bị kịch bản vi phạm; limit và actual là chuỗi thập phân chính xác
        của phép so sánh (giới hạn ramp là maxMwPerMinute × intervalMinutes).
      required: [code, stepIndex, limit, actual]
      properties:
        code:
          type: string
          enum: [POWER_ABOVE_MAX, POWER_BELOW_MIN, RAMP_EXCEEDED, SOC_OUT_OF_ENVELOPE]
        stepIndex:
          type: [integer, 'null']
          minimum: 0
          description: Chỉ số bước vi phạm (0-based); null khi vi phạm thuộc initialSocPercent
        limit: {type: string, pattern: '^-?\d+(\.\d+)?$'}
        actual: {type: string, pattern: '^-?\d+(\.\d+)?$'}
      additionalProperties: false
    DispatchSimulationVerdict:
      type: object
      description: >-
        Verdict advisory của API-075. feasible false KHÔNG phải lỗi HTTP: đây là cách mã
        BESS_CONSTRAINT_INFEASIBLE của tài liệu được trả in-band, kèm danh sách ràng buộc bị vi
        phạm. Không trường nào ở đây từng rời PM Web về phía OT.
      required: [bessPlantId, envelope, advisory, feasible, evaluatedSteps, intervalMinutes, violations]
      properties:
        bessPlantId: {type: string, format: uuid}
        envelope:
          type: object
          required: [bessPlantId, hierarchyVersion]
          properties:
            bessPlantId:
              type: string
              format: uuid
              description: Hàng RELEASED của site mang envelope đã dùng — có thể khác hàng được địa chỉ
            hierarchyVersion: {type: integer, minimum: 1}
          additionalProperties: false
        advisory:
          type: boolean
          const: true
          description: Luôn true — verdict chỉ để tham khảo, không bao giờ là lệnh hay setpoint
        feasible: {type: boolean}
        evaluatedSteps: {type: integer, minimum: 1, maximum: 288}
        intervalMinutes: {type: integer, minimum: 1, maximum: 60}
        violations:
          type: array
          items: {$ref: '#/components/schemas/DispatchViolation'}
      additionalProperties: false
    CreateEquipmentModelRequest:
      type: object
      required: [equipmentClass, manufacturer, model, specVersion]
      properties:
        equipmentClass: {type: string, minLength: 1, maxLength: 100}
        manufacturer: {type: string, minLength: 1, maxLength: 200}
        model: {type: string, minLength: 1, maxLength: 200}
        specVersion:
          type: string
          minLength: 1
          maxLength: 60
          description: Trùng (manufacturer, model, specVersion) trong tenant trả 409 EQUIPMENT_MODEL_CONFLICT
        ratings:
          type: object
          additionalProperties: true
          description: Tùy chọn; bỏ trống được lưu là object rỗng
        manufacturerCompanyId:
          type: string
          format: uuid
          description: Phải là company của tenant, nếu không 422 MANUFACTURER_COMPANY_NOT_FOUND
      additionalProperties: false
    BomLineInput:
      type: object
      required: [lineNo, itemCode, quantity, unit]
      properties:
        lineNo:
          type: integer
          minimum: 1
          description: Duy nhất trong payload, nếu trùng 422 BOM_LINE_DUPLICATE
        itemCode: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, minLength: 1, maxLength: 1000}
        quantity:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: >-
            Chuỗi thập phân đi nguyên văn vào Postgres numeric(19,4); lớn hơn 0 là check của DB,
            không phải so sánh JS — 0 trả 422 QUANTITY_INVALID
        unit: {type: string, minLength: 1, maxLength: 40}
        equipmentModelId:
          type: string
          format: uuid
          description: Phải tồn tại trong catalog của tenant, nếu không 422 EQUIPMENT_MODEL_NOT_FOUND
      additionalProperties: false
    ReleaseBomRequest:
      type: object
      description: >-
        API-070 nhận thẳng nội dung nháp: catalog không có operation tạo/sửa BOM DRAFT, nên lệnh
        release mang designRevisionId và trọn bộ dòng của version sẽ được tạo-rồi-release trong
        một transaction.
      required: [designRevisionId, lines]
      properties:
        designRevisionId:
          type: string
          format: uuid
          description: >-
            Phải là design revision của đúng dự án (422 DESIGN_REVISION_NOT_FOUND), ISSUED với
            kết quả quét CLEAN (422 DESIGN_REVISION_LOCKED) và không do người gọi upload (422
            RELEASE_SOD)
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/BomLineInput'}
      additionalProperties: false
    ReleaseSolarConfigurationRequest:
      type: object
      required: [expectedVersion, configuration]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: >-
            versionNo hiện tại của hàng được địa chỉ (mỏ neo optimistic concurrency); lệch trả
            409 VERSION_CONFLICT kèm currentVersion
        configuration:
          type: object
          additionalProperties: true
          description: >-
            Snapshot topology trọn vẹn của version sẽ release; được băm canonical vào
            configurationHash
        dcCapacityKwp:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: Bỏ trống kế thừa từ mỏ neo; không dương bị check của DB chặn (422 CAPACITY_INVALID)
        acCapacityKw:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: Bỏ trống kế thừa từ mỏ neo; không dương bị check của DB chặn (422 CAPACITY_INVALID)
        baselineRef:
          type: object
          additionalProperties: true
          description: Bỏ trống kế thừa từ mỏ neo
      additionalProperties: false
    DispatchStepInput:
      type: object
      required: [powerMw]
      properties:
        powerMw:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          description: >-
            Chuỗi thập phân có dấu: dương là xả, âm là sạc theo quy ước — chỉ là con số
            advisory, không bao giờ là setpoint
      additionalProperties: false
    SimulateDispatchRequest:
      type: object
      required: [intervalMinutes, steps]
      properties:
        intervalMinutes: {type: integer, minimum: 1, maximum: 60}
        initialSocPercent:
          type: string
          pattern: '^\d{1,3}(\.\d{1,4})?$'
          description: >-
            SOC phần trăm dạng chuỗi; băng SOC của envelope mới là giới hạn thật, kiểm chính xác
            bằng thập phân
        steps:
          type: array
          minItems: 1
          maxItems: 288
          items: {$ref: '#/components/schemas/DispatchStepInput'}
      additionalProperties: false
    EquipmentModelListResponse:
      type: object
      required: [data, meta, correlationId]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/EquipmentModel'}
        meta: {$ref: '#/components/schemas/EngineeringPlantsPageMeta'}
        correlationId: {type: string}
      additionalProperties: false
    EquipmentModelCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/EquipmentModel'}
        correlationId: {type: string}
      additionalProperties: false
    BillOfMaterialsListResponse:
      type: object
      required: [data, meta, correlationId]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/BillOfMaterialsVersion'}
        meta: {$ref: '#/components/schemas/EngineeringPlantsPageMeta'}
        correlationId: {type: string}
      additionalProperties: false
    BillOfMaterialsReleaseResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/BillOfMaterialsRelease'}
        correlationId: {type: string}
      additionalProperties: false
    SolarPlantDetailResponse:
      type: object
      required: [data, releasedConfiguration, versionHistory, correlationId]
      properties:
        data: {$ref: '#/components/schemas/SolarPlant'}
        releasedConfiguration:
          oneOf:
            - $ref: '#/components/schemas/SolarPlantReleasedConfiguration'
            - type: 'null'
          description: Null khi site chưa release cấu hình nào
        versionHistory:
          type: array
          items: {$ref: '#/components/schemas/SolarPlantVersionHistoryRow'}
          description: Toàn bộ version của site theo configurationVersion tăng dần, không phân trang
        correlationId: {type: string}
      additionalProperties: false
    SolarPlantReleaseResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/SolarPlantRelease'}
        correlationId: {type: string}
      additionalProperties: false
    BessPlantDetailResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/BessPlant'}
        correlationId: {type: string}
      additionalProperties: false
    DispatchSimulationResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/DispatchSimulationVerdict'}
        correlationId: {type: string}
      additionalProperties: false
    GenericCommand:
      type: object
      required: [commandType, data]
      properties:
        commandType:
          type: string
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 2000
        data:
          type: object
          additionalProperties: true
      additionalProperties: false
    TelemetryEnvelope:
      type: object
      required: [gatewayId, events]
      properties:
        gatewayId: {type: string}
        batchId: {type: string}
        events:
          type: array
          items:
            type: object
            required: [externalEventId, sourceTimestamp, quality]
            properties:
              externalEventId: {type: string}
              tagId: {type: string}
              sourceTimestamp: {type: string, format: date-time}
              sequence: {type: integer}
              value: {}
              unit: {type: string}
              quality: {type: string}
            additionalProperties: false
      additionalProperties: false
      description: Inbound measurements/events only; command/control fields are prohibited
    Error:
      type: object
      required: [code, message, correlationId, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        correlationId: {type: string}
        retryable: {type: boolean}
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
    WebhookEvent:
      type: object
      required: [eventId, eventType, eventVersion, occurredAt, objectRef, correlationId]
      properties:
        eventId: {type: string}
        eventType: {type: string}
        eventVersion: {type: string}
        occurredAt: {type: string, format: date-time}
        objectRef:
          type: object
          additionalProperties: true
        correlationId: {type: string}
    IdentityPageMeta:
      type: object
      required: [nextCursor, limit]
      properties:
        nextCursor: {type: [string, 'null'], maxLength: 500}
        limit: {type: integer, minimum: 1, maximum: 100}
      additionalProperties: false
    MePermissionsResponse:
      type: object
      required: [data, correlationId]
      properties:
        data:
          type: object
          description: >-
            Kết quả của đúng bộ đánh giá quyền mà guard dùng; không phải bộ đánh giá thứ hai.
          required: [userId, tenantId, roles, permissions, scopes, policyVersion]
          properties:
            userId: {type: string, format: uuid}
            tenantId: {type: string, format: uuid}
            roles:
              type: array
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 80}
              description: Mã role đã khử trùng lặp và sắp xếp
            permissions:
              type: array
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 120}
              description: Hợp của mọi permission theo các assignment còn hiệu lực, đã sắp xếp
            scopes:
              type: array
              description: Mỗi assignment còn hiệu lực một phần tử; đây là phần "vì sao được phép"
              items:
                type: object
                required: [roleCode, permissions, scopeType, scopeId]
                properties:
                  roleCode: {type: string, minLength: 1, maxLength: 80}
                  permissions:
                    type: array
                    uniqueItems: true
                    items: {type: string, minLength: 1, maxLength: 120}
                  scopeType: {$ref: '#/components/schemas/AssignmentScopeType'}
                  scopeId: {type: [string, 'null'], format: uuid}
                additionalProperties: false
            policyVersion:
              type: integer
              minimum: 0
              description: Policy version lớn nhất trong các role ACTIVE; 0 khi người gọi không có role nào
          additionalProperties: false
        correlationId: {type: string}
      additionalProperties: false
    TenantStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
    TenantResponse:
      type: object
      required: [data, correlationId]
      properties:
        data:
          type: object
          description: Chỉ các cột thật của DB-001; `locale` chưa tồn tại nên không được trả về
          required: [id, code, name, status, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            code: {type: string, minLength: 1, maxLength: 64}
            name: {type: string, minLength: 1, maxLength: 200}
            status: {$ref: '#/components/schemas/TenantStatus'}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
          additionalProperties: false
        correlationId: {type: string}
      additionalProperties: false
    AssignmentScopeType:
      type: string
      enum: [TENANT, PORTFOLIO, PROJECT, PACKAGE]
      description: >-
        Vốn từ đầy đủ của DB-007. API-009 chỉ CẤP được TENANT/PROJECT/PACKAGE; PORTFOLIO cố ý nằm
        ngoài V1 nên không xuất hiện trong request schema.
    RoleAssignmentScopeType:
      type: string
      enum: [TENANT, PROJECT, PACKAGE]
      description: Các scope kind mà API-009 được phép cấp trong V1
    RoleAssignmentStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
      description: API-010 chuyển ACTIVE → INACTIVE; hàng không bao giờ bị xóa (SEC-118)
    RoleAssignment:
      type: object
      description: DB-007 assignment row
      required: [id, userAccountId, roleId, scopeType, scopeId, effectiveFrom, effectiveTo, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        userAccountId: {type: string, format: uuid}
        roleId: {type: string, format: uuid}
        scopeType: {$ref: '#/components/schemas/AssignmentScopeType'}
        scopeId:
          type: [string, 'null']
          format: uuid
          description: Luôn null với scope TENANT; bắt buộc với PROJECT/PACKAGE
        effectiveFrom: {type: string, format: date-time}
        effectiveTo: {type: [string, 'null'], format: date-time}
        status: {$ref: '#/components/schemas/RoleAssignmentStatus'}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    CreateRoleAssignmentRequest:
      type: object
      required: [userAccountId, roleId, scopeType]
      properties:
        userAccountId: {type: string, format: uuid}
        roleId: {type: string, format: uuid}
        scopeType: {$ref: '#/components/schemas/RoleAssignmentScopeType'}
        scopeId:
          type: string
          format: uuid
          description: Cấm với TENANT, bắt buộc với PROJECT/PACKAGE — sai trả 422 SCOPE_INVALID
        effectiveFrom:
          type: string
          format: date-time
          description: Bỏ trống thì mặc định là thời điểm gọi
        effectiveTo:
          type: string
          format: date-time
          description: Nếu có thì phải sau effectiveFrom
      additionalProperties: false
    RoleAssignmentCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/RoleAssignment'}
        correlationId: {type: string}
      additionalProperties: false
    DelegationStatus:
      type: string
      enum: [ACTIVE, REVOKED, EXPIRED]
      description: >-
        EXPIRED dành cho housekeeping; điều kiện dùng được của một delegation luôn được kiểm lại
        theo cửa sổ hiệu lực tại thời điểm sử dụng.
    DelegationScope:
      type: object
      description: Phạm vi thu hẹp của một delegation; mảng rỗng nghĩa là "không hạn chế theo chiều đó"
      required: [workflowDefinitionCodes, projectIds]
      properties:
        workflowDefinitionCodes:
          type: array
          maxItems: 50
          items: {type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{1,79}$', maxLength: 80}
        projectIds:
          type: array
          maxItems: 50
          items: {type: string, format: uuid}
      additionalProperties: false
    Delegation:
      type: object
      description: DB-008 delegation row; không có cột value_limit theo thiết kế
      required: [id, delegatorId, delegateId, scope, effectiveFrom, effectiveTo, reason, status, revokedBy, revokedAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        delegatorId: {type: string, format: uuid, description: Luôn là người gọi API-011}
        delegateId: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/DelegationScope'}
        effectiveFrom: {type: string, format: date-time}
        effectiveTo: {type: string, format: date-time}
        reason: {type: string, minLength: 3, maxLength: 2000}
        status: {$ref: '#/components/schemas/DelegationStatus'}
        revokedBy: {type: [string, 'null'], format: uuid}
        revokedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    CreateDelegationRequest:
      type: object
      description: >-
        Không có `delegatorId`: người ủy quyền luôn là người gọi. `valueLimit` được khai báo ở đây
        chỉ để bị TỪ CHỐI tường minh 422 VALUE_LIMIT_NOT_SUPPORTED thay vì chìm trong lỗi validation
        vô danh — chưa có cơ chế nào cưỡng chế hạn mức tiền nên lưu nó sẽ là kiểm soát giả.
      required: [delegateId, effectiveFrom, effectiveTo, reason]
      properties:
        delegateId: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/DelegationScope'}
        effectiveFrom: {type: string, format: date-time}
        effectiveTo: {type: string, format: date-time, description: Phải sau effectiveFrom}
        reason: {type: string, minLength: 3, maxLength: 2000}
        valueLimit:
          description: Không được hỗ trợ; gửi trường này luôn trả 422 VALUE_LIMIT_NOT_SUPPORTED
      additionalProperties: false
    RevokeDelegationRequest:
      type: object
      properties:
        reason: {type: string, minLength: 3, maxLength: 2000}
      additionalProperties: false
    DelegationCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/Delegation'}
        correlationId: {type: string}
      additionalProperties: false
    AuditEvent:
      type: object
      description: DB-098 audit row của đúng tenant người gọi
      required: [id, actorId, action, result, reasonCode, objectType, objectId, correlationId, payload, occurredAt]
      properties:
        id: {type: string, format: uuid}
        actorId: {type: [string, 'null'], format: uuid}
        action: {type: string, minLength: 1, maxLength: 80}
        result: {type: string, minLength: 1, maxLength: 20}
        reasonCode: {type: [string, 'null'], maxLength: 80}
        objectType: {type: [string, 'null'], maxLength: 80}
        objectId: {type: [string, 'null'], format: uuid}
        correlationId: {type: string, minLength: 1, maxLength: 100}
        payload:
          type: ['object', 'null']
          additionalProperties: true
          description: Payload đã được redact bởi bên phát sự kiện; không chứa dữ liệu hạn chế
        occurredAt: {type: string, format: date-time}
      additionalProperties: false
    AuditEventListResponse:
      type: object
      required: [data, meta, correlationId]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AuditEvent'}
        meta: {$ref: '#/components/schemas/IdentityPageMeta'}
        correlationId: {type: string}
      additionalProperties: false
    OpportunityStage:
      type: string
      enum: [LEAD, QUALIFIED, SURVEYED, SCENARIO_READY, SUBMITTED, APPROVED, RETURNED, REJECTED, CONVERTED]
      description: >-
        WF-002 đầy đủ. API-029 chỉ lái được các cạnh kề LEAD → QUALIFIED → SURVEYED →
        SCENARIO_READY và RETURNED → SCENARIO_READY. SUBMITTED thuộc API-032, CONVERTED thuộc
        API-033, còn APPROVED/RETURNED/REJECTED thuộc quyết định phê duyệt — chưa có operation nào
        trong catalog, nên APPROVED không đạt tới được qua API trong V1.
    SurveyDataQuality:
      type: string
      enum: [RAW, VALIDATED, APPROVED]
      description: Hàng survey ở APPROVED trở thành bất biến (trigger của cơ sở dữ liệu)
    InvestmentScenarioType:
      type: string
      enum: [SOLAR, BESS, HYBRID]
    InvestmentScenarioStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, RETURNED, REJECTED]
      description: >-
        API-031 tạo DRAFT, API-032 chuyển sang SUBMITTED. APPROVED/RETURNED/REJECTED chưa có
        operation nào trong catalog (chờ engine chấp nhận target tiền-dự-án).
    OpportunityPageMeta:
      type: object
      required: [nextCursor, limit]
