        của workflow instance (nếu có); `storedStatus` phơi đúng cột lưu trữ để chứng minh không có
        bản sao nào được ghi xuống.
      required: [id, opportunityId, scenarioType, version, status, storedStatus, currency, capexTotal, npv, irr, paybackMonths, inputSnapshot, outputSnapshot, formulaVersion, workflowInstanceId, workflowInstanceState, submittedBy, submittedAt, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        opportunityId: {type: string, format: uuid}
        scenarioType: {$ref: '#/components/schemas/InvestmentScenarioType'}
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/InvestmentScenarioStatus'}
        storedStatus: {$ref: '#/components/schemas/InvestmentScenarioStatus'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        capexTotal: {type: [string, 'null'], pattern: '^\d{1,15}(\.\d{1,4})?$'}
        npv: {type: [string, 'null'], pattern: '^-?\d{1,15}(\.\d{1,4})?$'}
        irr: {type: [string, 'null'], pattern: '^-?\d{1,3}(\.\d{1,6})?$'}
        paybackMonths: {type: ['integer', 'null'], minimum: 0}
        inputSnapshot: {type: object, additionalProperties: true}
        outputSnapshot: {type: object, additionalProperties: true}
        formulaVersion: {type: string, minLength: 1, maxLength: 40}
        workflowInstanceId: {type: [string, 'null'], format: uuid}
        workflowInstanceState:
          anyOf:
            - {$ref: '#/components/schemas/WorkflowInstanceState'}
