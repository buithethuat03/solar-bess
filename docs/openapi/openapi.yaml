      type: string
      enum: [DRAFT, TECHNICAL_CHECK, COST_CHECK, SUBMITTED, APPROVED, RETURNED, REJECTED, SOURCING]
      description: >-
        Vòng đời FR-062 đầy đủ, nhưng API-077 chỉ tạo ra DRAFT: vòng kiểm tra/phê duyệt sẽ cưỡi lên
        workflow engine US-015 về sau (hoãn có ghi nhận).
    RfqStatus:
      type: string
      enum: [RFQ_DRAFT, ISSUED, BID_OPEN, CLOSED, TECHNICAL_EVALUATION, COMMERCIAL_EVALUATION, AWARD_SUBMITTED, AWARD_APPROVED, REJECTED]
      description: >-
        API-078 tạo thẳng ISSUED (không có endpoint nháp). Từ CLOSED trở đi các trường thương mại
        của bid mới được serialize. AWARD_APPROVED chưa có operation nào trong catalog.
