        nextCursor: {type: [string, 'null'], maxLength: 500}
        limit: {type: integer, minimum: 1, maximum: 100}
      additionalProperties: false
    Opportunity:
      type: object
      description: DB-014 pipeline row; sức chứa là chuỗi numeric(19,4), không bao giờ là JSON number
      required: [id, code, name, stage, customerCompanyId, siteId, locationText, expectedCapacityKwp, duplicateKey, ownerId, convertedProjectId, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{0,63}$', maxLength: 64}
        name: {type: string, minLength: 3, maxLength: 400}
        stage: {$ref: '#/components/schemas/OpportunityStage'}
        customerCompanyId: {type: [string, 'null'], format: uuid}
        siteId:
          type: [string, 'null']
          format: uuid
          description: Tham chiếu site ứng viên dạng mờ; cố ý KHÔNG có khóa ngoại tới DB-011
        locationText: {type: [string, 'null'], maxLength: 500}
        expectedCapacityKwp:
          type: [string, 'null']
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: numeric(19,4) dạng chuỗi
        duplicateKey:
          type: [string, 'null']
          maxLength: 200
          description: Do SERVER tính từ (khách hàng, địa điểm chuẩn hóa); null khi thiếu một trong hai
        ownerId: {type: string, format: uuid}
        convertedProjectId: {type: [string, 'null'], format: uuid}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    CreateOpportunityRequest:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{0,63}$', maxLength: 64}
        name: {type: string, minLength: 3, maxLength: 400}
        customerCompanyId: {type: string, format: uuid}
        siteId: {type: string, format: uuid, description: Tham chiếu mờ; không được kiểm chứng}
        locationText: {type: string, minLength: 1, maxLength: 500}
        expectedCapacityKwp: {type: string, pattern: '^\d{1,15}(\.\d{1,4})?$'}
        ownerId: {type: string, format: uuid, description: Bỏ trống thì mặc định là người gọi}
      additionalProperties: false
    UpdateOpportunityRequest:
      type: object
      description: Optimistic concurrency nằm trong body; endpoint KHÔNG dùng header If-Match
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        stage: {$ref: '#/components/schemas/OpportunityStage'}
        name: {type: string, minLength: 3, maxLength: 400}
        ownerId: {type: string, format: uuid}
        customerCompanyId: {type: string, format: uuid}
        siteId: {type: string, format: uuid}
        locationText: {type: string, minLength: 1, maxLength: 500}
        expectedCapacityKwp: {type: string, pattern: '^\d{1,15}(\.\d{1,4})?$'}
      additionalProperties: false
    SurveyPackage:
      type: object
      description: DB-015 survey revision; documentRefs chỉ là tham chiếu mờ, không bao giờ là bytes
      required: [id, opportunityId, revision, dataQuality, documentRefs, notes, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        opportunityId: {type: string, format: uuid}
