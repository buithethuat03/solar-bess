    ContractType:
      type: string
      enum: [EPC, EQUIPMENT_LEASE, PPA, ESCO, SUBCONTRACT, EQUIPMENT_PURCHASE]
    ContractStatus:
      type: string
      enum: [DRAFT, REVIEW, APPROVED, SIGNED, EFFECTIVE, SUSPENDED, EXPIRED, CLOSED]
      description: >-
        Vòng đời FR-036 đầy đủ, nhưng V1 chỉ tạo ra DRAFT: catalog chưa có operation ký hay kích
        hoạt, nên các trạng thái sau DRAFT chưa thể đạt tới qua API này. Hợp đồng CLOSED/EXPIRED
        không nhận phụ lục hay payment mới.
    ContractPartyRole:
      type: string
      enum: [OWNER, EPC, VENDOR, LENDER, SUBCONTRACTOR, OFFTAKER]
    ContractAppendixType:
      type: string
      enum: [AMENDMENT, ADDENDUM]
    ContractAppendixStatus:
      type: string
      enum: [DRAFT, EFFECTIVE, SUPERSEDED, CANCELLED]
      description: >-
        API-058 chỉ tạo DRAFT hoặc trực tiếp EFFECTIVE; SUPERSEDED/CANCELLED chưa có operation
        chuyển trạng thái trong catalog. Chỉ phụ lục EFFECTIVE được cộng vào consolidatedValue.
    ObligationStatus:
      type: string
      enum: [OPEN, DUE, OVERDUE, FULFILLED, WAIVED, CANCELLED]
      description: >-
        DUE và OVERDUE chỉ tồn tại trong projection đọc của API-059: chúng được suy ra tại thời
        điểm đọc từ dueDate so với CURRENT_DATE của cơ sở dữ liệu và không bao giờ được ghi xuống
        hàng — trạng thái lưu trữ giữ OPEN cho tới khi có người quyết định.
    ObligationStoredStatus:
      type: string
      enum: [OPEN, FULFILLED, WAIVED, CANCELLED]
      description: Trạng thái thật nằm trong cột status; không bao giờ chứa DUE/OVERDUE
    ObligationDecisionType:
      type: string
      enum: [FULFILLED, WAIVED]
    BudgetVersionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, SUPERSEDED]
      description: API-063 sinh SUBMITTED; operation phê duyệt budget chưa có trong catalog
    CommitmentStatus:
      type: string
      enum: [ACTIVE, REVERSED, CLOSED]
    CommitmentSourceType:
      type: string
      enum: [CONTRACT, CONTRACT_APPENDIX]
      description: Procurement purchase order bị hoãn; V1 chỉ có nguồn thuộc họ hợp đồng
    PaymentStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, SENT, PAID, RECONCILED, CANCELLED]
      description: API-065 chỉ tạo DRAFT; submit/approve/post/reconcile chưa có operation trong catalog
    PaymentComponentType:
      type: string
      enum: [BASE, VAT, RETENTION, RETENTION_RELEASE, WITHHOLDING, ADVANCE_RECOVERY, OTHER_DEDUCTION]
      description: >-
        Loại khấu trừ (RETENTION, WITHHOLDING, ADVANCE_RECOVERY, OTHER_DEDUCTION) phải mang amount
        nhỏ hơn hoặc bằng 0; loại cộng (BASE, VAT, RETENTION_RELEASE) phải mang amount lớn hơn hoặc
        bằng 0 — sai dấu trả 422 COMPONENT_SIGN_INVALID.
    ContractCostPageMeta:
      type: object
      required: [nextCursor, limit]
      properties:
        nextCursor: {type: [string, 'null'], maxLength: 500}
        limit: {type: integer, minimum: 1, maximum: 100}
      additionalProperties: false
    Contract:
      type: object
      description: >-
        DB-028 register row. Tiền là chuỗi thập phân numeric(19,4) đọc lại từ Postgres — không
        trường tiền nào trong nhóm API này là JSON number.
      required: [id, projectId, contractNo, title, type, status, effectiveFrom, effectiveTo, value, currency, rootDocumentId, legalHold, signedAt, signedBy, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        contractNo: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{1,79}$', maxLength: 80}
        title: {type: string, minLength: 3, maxLength: 400}
        type: {$ref: '#/components/schemas/ContractType'}
        status: {$ref: '#/components/schemas/ContractStatus'}
        effectiveFrom: {type: [string, 'null'], format: date}
        effectiveTo: {type: [string, 'null'], format: date}
        value:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: Tiền numeric(19,4) không âm dạng chuỗi
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        rootDocumentId: {type: [string, 'null'], format: uuid}
        legalHold: {type: boolean}
        signedAt:
          type: [string, 'null']
          format: date-time
          description: Luôn null trong V1 — chưa có operation ký trong catalog
        signedBy:
          type: [string, 'null']
          format: uuid
          description: Luôn null trong V1 — chưa có operation ký trong catalog
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    ContractConsolidatedView:
      type: object
      description: >-
        Register row kèm consolidatedValue = value + SUM(valueImpact của phụ lục EFFECTIVE), tính
        trọn vẹn trong Postgres numeric; phụ lục chưa EFFECTIVE không được cộng.
      required: [id, projectId, contractNo, title, type, status, effectiveFrom, effectiveTo, value, currency, rootDocumentId, legalHold, signedAt, signedBy, versionNo, createdBy, updatedBy, createdAt, updatedAt, consolidatedValue]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        contractNo: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{1,79}$', maxLength: 80}
        title: {type: string, minLength: 3, maxLength: 400}
        type: {$ref: '#/components/schemas/ContractType'}
        status: {$ref: '#/components/schemas/ContractStatus'}
        effectiveFrom: {type: [string, 'null'], format: date}
        effectiveTo: {type: [string, 'null'], format: date}
        value:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: Tiền numeric(19,4) không âm dạng chuỗi
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        rootDocumentId: {type: [string, 'null'], format: uuid}
        legalHold: {type: boolean}
        signedAt: {type: [string, 'null'], format: date-time}
        signedBy: {type: [string, 'null'], format: uuid}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        consolidatedValue:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
          description: >-
            SQL aggregate dạng chuỗi trong cùng loại tiền của hợp đồng; có thể âm khi các phụ lục
            giảm giá trị vượt quá value
      additionalProperties: false
    ContractParty:
      type: object
      description: >-
        DB-029 legal snapshot append-only (FR-037). Các trường *Snapshot được copy từ legal-entity
        master trong cùng transaction và băm canonical vào snapshotHash; không có operation sửa hay
        xóa.
      required: [id, contractId, projectId, companyId, legalEntityId, partyRole, legalNameSnapshot, countrySnapshot, registrationNoSnapshot, taxIdSnapshot, representativeName, representativeTitle, authorityReference, snapshotAt, snapshotHash, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        legalEntityId: {type: string, format: uuid}
        partyRole: {$ref: '#/components/schemas/ContractPartyRole'}
        legalNameSnapshot: {type: string, minLength: 1, maxLength: 250}
        countrySnapshot: {type: string, pattern: '^[A-Z]{2}$'}
        registrationNoSnapshot: {type: string, minLength: 1, maxLength: 100}
        taxIdSnapshot: {type: [string, 'null'], maxLength: 100}
        representativeName: {type: [string, 'null'], maxLength: 200}
        representativeTitle: {type: [string, 'null'], maxLength: 200}
        authorityReference: {type: [string, 'null'], maxLength: 400}
        snapshotAt: {type: string, format: date-time}
        snapshotHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    ContractAppendix:
      type: object
      description: >-
        DB-030. currency luôn bằng loại tiền của hợp đồng cha — khóa ngoại composite làm phụ lục
        khác tiền không thể tồn tại; valueImpact là tiền có dấu, phụ lục giảm giá trị là hợp lệ.
      required: [id, contractId, projectId, appendixNo, revisionNo, type, effectiveDate, valueImpact, currency, documentId, status, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        appendixNo: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{1,79}$', maxLength: 80}
        revisionNo: {type: integer, minimum: 1}
        type: {$ref: '#/components/schemas/ContractAppendixType'}
        effectiveDate:
          type: [string, 'null']
          format: date
          description: Không bao giờ null khi status là EFFECTIVE
        valueImpact:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          description: Tiền có dấu numeric(19,4) dạng chuỗi
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        documentId: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/ContractAppendixStatus'}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    Obligation:
      type: object
      description: >-
        DB-031 qua các command API-060/061. status ở đây là trạng thái lưu trữ — không bao giờ
        DUE/OVERDUE; bộ trường decision* chỉ khác null sau khi API-061 quyết định.
      required: [id, contractId, projectId, appendixId, clauseRef, title, obligorPartyId, beneficiaryPartyId, ownerUserId, triggerType, triggerReference, dueDate, status, evidenceRefs, consequence, decisionType, decisionBy, decisionAt, decisionReason, decisionEvidenceRefs, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        appendixId: {type: [string, 'null'], format: uuid}
        clauseRef: {type: string, minLength: 1, maxLength: 200}
        title: {type: string, minLength: 3, maxLength: 400}
        obligorPartyId: {type: string, format: uuid}
        beneficiaryPartyId: {type: string, format: uuid}
        ownerUserId: {type: string, format: uuid}
        triggerType: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,29}$'}
        triggerReference: {type: [string, 'null'], maxLength: 400}
        dueDate: {type: [string, 'null'], format: date}
        status: {$ref: '#/components/schemas/ObligationStoredStatus'}
        evidenceRefs:
          type: array
          maxItems: 50
          items: {type: string, maxLength: 500}
        consequence: {type: [string, 'null'], maxLength: 2000}
        decisionType:
          oneOf:
            - $ref: '#/components/schemas/ObligationDecisionType'
            - type: 'null'
        decisionBy:
          type: [string, 'null']
          format: uuid
          description: Không bao giờ trùng ownerUserId hay createdBy — SoD mức hàng ck_obligation_sod
        decisionAt: {type: [string, 'null'], format: date-time}
        decisionReason: {type: [string, 'null'], maxLength: 2000}
        decisionEvidenceRefs:
          type: [array, 'null']
          maxItems: 50
          items: {type: string, maxLength: 500}
          description: Tối thiểu một phần tử khi đã FULFILLED/WAIVED; null khi chưa quyết định
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    ObligationRegisterRow:
      type: object
      description: >-
        Một dòng API-059. status là projection suy ra tại thời điểm đọc (OPEN quá hạn đọc thành
        OVERDUE, đến hạn hôm nay thành DUE); storedStatus là cột status thật — hàng đã quyết định
        hoặc hủy luôn giữ trạng thái lưu trữ của nó.
      required: [id, contractId, projectId, appendixId, clauseRef, title, obligorPartyId, beneficiaryPartyId, ownerUserId, triggerType, triggerReference, dueDate, status, storedStatus, evidenceRefs, consequence, decisionType, decisionBy, decisionAt, decisionReason, decisionEvidenceRefs, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        appendixId: {type: [string, 'null'], format: uuid}
        clauseRef: {type: string, minLength: 1, maxLength: 200}
        title: {type: string, minLength: 3, maxLength: 400}
        obligorPartyId: {type: string, format: uuid}
        beneficiaryPartyId: {type: string, format: uuid}
        ownerUserId: {type: string, format: uuid}
        triggerType: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,29}$'}
        triggerReference: {type: [string, 'null'], maxLength: 400}
        dueDate: {type: [string, 'null'], format: date}
        status: {$ref: '#/components/schemas/ObligationStatus'}
        storedStatus: {$ref: '#/components/schemas/ObligationStoredStatus'}
        evidenceRefs:
          type: array
          maxItems: 50
          items: {type: string, maxLength: 500}
        consequence: {type: [string, 'null'], maxLength: 2000}
        decisionType:
          oneOf:
            - $ref: '#/components/schemas/ObligationDecisionType'
            - type: 'null'
        decisionBy: {type: [string, 'null'], format: uuid}
        decisionAt: {type: [string, 'null'], format: date-time}
        decisionReason: {type: [string, 'null'], maxLength: 2000}
        decisionEvidenceRefs:
          type: [array, 'null']
          maxItems: 50
          items: {type: string, maxLength: 500}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    BudgetVersion:
      type: object
      description: >-
        DB-035 header-only trong V1: line items bị hoãn có chủ đích. approvedBy/approvedAt luôn
        null vì operation phê duyệt budget chưa có trong catalog.
      required: [id, projectId, budgetVersion, currency, totalAmount, status, snapshot, snapshotHash, submittedBy, submittedAt, approvedBy, approvedAt, versionNo, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        budgetVersion:
          type: integer
          minimum: 1
          description: Cấp trong transaction theo MAX+1 của dự án; duy nhất trong dự án
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        totalAmount:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: Tiền numeric(19,4) không âm dạng chuỗi
        status: {$ref: '#/components/schemas/BudgetVersionStatus'}
        snapshot:
          type: [object, 'null']
          additionalProperties: true
        snapshotHash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: Canonical hash của snapshot; null khi không gửi snapshot
        submittedBy: {type: string, format: uuid}
        submittedAt: {type: string, format: date-time}
        approvedBy: {type: [string, 'null'], format: uuid}
        approvedAt: {type: [string, 'null'], format: date-time}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    Commitment:
      type: object
      description: >-
        DB-036 ledger append-only: bản gốc dương, bản đảo âm và tham chiếu bản gốc qua
        reversesCommitmentId; không có operation sửa hay xóa.
      required: [id, projectId, contractId, costCodeId, amount, currency, status, sourceType, sourceId, sourceVersion, reversesCommitmentId, versionNo, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        costCodeId: {type: string, format: uuid}
        amount:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          description: Tiền có dấu numeric(19,4) dạng chuỗi; dương cho bản gốc, âm cho bản đảo
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Luôn là loại tiền của hợp đồng nguồn
        status: {$ref: '#/components/schemas/CommitmentStatus'}
        sourceType: {$ref: '#/components/schemas/CommitmentSourceType'}
        sourceId: {type: string, format: uuid}
        sourceVersion: {type: integer, minimum: 1}
        reversesCommitmentId: {type: [string, 'null'], format: uuid}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: false
    PaymentComponent:
      type: object
      description: >-
        DB-039 một dòng breakdown. currency bị ràng vào payment bởi khóa ngoại composite; tổng
        amount của mọi component phải đúng bằng requestedAmount của payment — đẳng thức do trigger
        DEFERRABLE của Postgres kiểm.
      required: [id, paymentId, sequenceNo, componentType, basisAmount, rate, amount, currency, ruleVersion, createdAt]
      properties:
        id: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        sequenceNo: {type: integer, minimum: 1}
        componentType: {$ref: '#/components/schemas/PaymentComponentType'}
        basisAmount:
          type: [string, 'null']
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
        rate:
          type: [string, 'null']
          pattern: '^-?\d{1,3}(\.\d{1,6})?$'
          description: numeric(9,6) dạng chuỗi
        amount:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          description: Tiền có dấu numeric(19,4) dạng chuỗi; dấu bị ràng theo componentType
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        ruleVersion: {type: string, minLength: 1, maxLength: 40}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    PaymentWithComponents:
      type: object
      description: >-
        DB-038 payment kèm breakdown DB-039, sắp theo sequenceNo. approvedAmount, paidAmount,
        paidAt, bankReference, externalPostingRef, submittedBy và approvedBy luôn null trong V1 vì
        các operation submit/approve/post chưa có trong catalog.
      required: [id, projectId, contractId, invoiceId, payerCompanyId, payerLegalEntityId, payeeCompanyId, payeeLegalEntityId, fxSnapshotId, milestoneRef, requestedAmount, approvedAmount, paidAmount, currency, status, paidAt, bankReference, externalPostingRef, evidenceRefs, requestedBy, submittedBy, approvedBy, versionNo, createdBy, updatedBy, createdAt, updatedAt, components]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        invoiceId:
          type: [string, 'null']
          format: uuid
          description: Hóa đơn được tạo hoặc dùng lại trong cùng transaction; null khi không gửi kèm
        payerCompanyId: {type: string, format: uuid}
        payerLegalEntityId: {type: string, format: uuid}
        payeeCompanyId: {type: string, format: uuid}
        payeeLegalEntityId:
          type: string
          format: uuid
          description: Luôn khác payerLegalEntityId theo ck_payment_distinct_parties
        fxSnapshotId: {type: [string, 'null'], format: uuid}
        milestoneRef: {type: [string, 'null'], maxLength: 200}
        requestedAmount:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: Tiền numeric(19,4) dạng chuỗi, luôn lớn hơn 0
        approvedAmount: {type: [string, 'null'], pattern: '^\d{1,15}(\.\d{1,4})?$'}
        paidAmount: {type: [string, 'null'], pattern: '^\d{1,15}(\.\d{1,4})?$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        paidAt: {type: [string, 'null'], format: date-time}
        bankReference: {type: [string, 'null'], maxLength: 200}
        externalPostingRef: {type: [string, 'null'], maxLength: 200}
        evidenceRefs:
          type: array
          maxItems: 50
          items: {type: string, maxLength: 500}
        requestedBy: {type: string, format: uuid}
        submittedBy: {type: [string, 'null'], format: uuid}
        approvedBy: {type: [string, 'null'], format: uuid}
        versionNo: {type: integer, minimum: 1}
        createdBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        components:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/PaymentComponent'}
      additionalProperties: false
    CostSummaryBudgetRow:
      type: object
      description: Budget version mới nhất cho từng trạng thái hiện diện trong dự án
      required: [status, budgetVersion, currency, totalAmount]
      properties:
        status: {$ref: '#/components/schemas/BudgetVersionStatus'}
        budgetVersion: {type: integer, minimum: 1}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        totalAmount: {type: string, pattern: '^\d+(\.\d{1,4})?$'}
      additionalProperties: false
    CostSummaryCommitmentRow:
      type: object
      required: [currency, status, costCodeId, costCode, amount]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        status: {$ref: '#/components/schemas/CommitmentStatus'}
        costCodeId: {type: string, format: uuid}
        costCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,39}$', maxLength: 40}
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
          description: SUM tính trong Postgres numeric, chỉ cộng trong đúng một loại tiền
      additionalProperties: false
    CostSummaryPaymentRow:
      type: object
      required: [currency, status, requestedAmount, approvedAmount, paidAmount, paymentCount]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        requestedAmount: {type: string, pattern: '^-?\d+(\.\d{1,4})?$'}
        approvedAmount: {type: [string, 'null'], pattern: '^-?\d+(\.\d{1,4})?$'}
        paidAmount: {type: [string, 'null'], pattern: '^-?\d+(\.\d{1,4})?$'}
        paymentCount: {type: integer, minimum: 1}
      additionalProperties: false
    CostSummary:
      type: object
      required: [projectId, reportingCurrency, budget, commitments, payments]
      properties:
        projectId: {type: string, format: uuid}
        reportingCurrency:
          type: 'null'
          description: >-
            Luôn null một cách có chủ đích: không tồn tại quy đổi hay tổng xuyên loại tiền nào
            trong read model này
        budget:
          type: array
          items: {$ref: '#/components/schemas/CostSummaryBudgetRow'}
        commitments:
          type: array
          items: {$ref: '#/components/schemas/CostSummaryCommitmentRow'}
        payments:
          type: array
          items: {$ref: '#/components/schemas/CostSummaryPaymentRow'}
      additionalProperties: false
    CreateContractRequest:
      type: object
      required: [contractNo, title, type, value, currency]
      properties:
        contractNo: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{1,79}$', maxLength: 80}
        title: {type: string, minLength: 3, maxLength: 400}
        type: {$ref: '#/components/schemas/ContractType'}
        value:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: >-
            Tiền dạng chuỗi thập phân đi nguyên văn vào Postgres numeric(19,4); không bao giờ được
            parse thành JS number
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        effectiveFrom: {type: string, format: date}
        effectiveTo:
          type: string
          format: date
          description: Phải không sớm hơn effectiveFrom, nếu không 422 CONTRACT_DATES_INVALID
        rootDocumentId:
          type: string
          format: uuid
          description: Phải là tài liệu của đúng dự án, nếu không 422 DOCUMENT_NOT_FOUND
      additionalProperties: false
    UpdateContractRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: versionNo hiện tại của hợp đồng; lệch trả 409 VERSION_CONFLICT kèm currentVersion
        title: {type: string, minLength: 3, maxLength: 400}
        type: {$ref: '#/components/schemas/ContractType'}
        value: {type: string, pattern: '^\d{1,15}(\.\d{1,4})?$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        effectiveFrom: {type: string, format: date}
        effectiveTo: {type: string, format: date}
        rootDocumentId: {type: string, format: uuid}
      additionalProperties: false
    CreateContractPartyRequest:
      type: object
      required: [companyId, legalEntityId, partyRole]
      properties:
        companyId: {type: string, format: uuid}
        legalEntityId:
          type: string
          format: uuid
          description: Phải thuộc đúng company trong cùng tenant, nếu không 422 LEGAL_ENTITY_NOT_FOUND
        partyRole: {$ref: '#/components/schemas/ContractPartyRole'}
        representativeName: {type: string, minLength: 1, maxLength: 200}
        representativeTitle: {type: string, minLength: 1, maxLength: 200}
        authorityReference: {type: string, minLength: 1, maxLength: 400}
      additionalProperties: false
    CreateContractAppendixRequest:
      type: object
      required: [appendixNo, type]
      properties:
        appendixNo: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{1,79}$', maxLength: 80}
        revisionNo: {type: integer, minimum: 1, default: 1}
        type: {$ref: '#/components/schemas/ContractAppendixType'}
        effectiveDate:
          type: string
          format: date
          description: Bắt buộc khi status là EFFECTIVE, nếu thiếu 422 EFFECTIVE_DATE_REQUIRED
        valueImpact:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          default: '0'
          description: Tiền có dấu dạng chuỗi; bỏ trống được hiểu là 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Mặc định theo hợp đồng cha; giá trị khác trả 422 CURRENCY_MISMATCH
        documentId:
          type: string
          format: uuid
          description: Phải là tài liệu của đúng dự án, nếu không 422 DOCUMENT_NOT_FOUND
        status:
          type: string
          enum: [DRAFT, EFFECTIVE]
          default: DRAFT
          description: >-
            Chỉ DRAFT hoặc trực tiếp EFFECTIVE — chưa có operation chuyển trạng thái phụ lục trong
            catalog, và phụ lục không bao giờ EFFECTIVE được thì không bao giờ hợp nhất được giá
            trị hợp đồng
      additionalProperties: false
    CreateObligationRequest:
      type: object
      required: [clauseRef, title, obligorPartyId, beneficiaryPartyId, triggerType]
      properties:
        clauseRef: {type: string, minLength: 1, maxLength: 200}
        title: {type: string, minLength: 3, maxLength: 400}
        obligorPartyId:
          type: string
          format: uuid
          description: Phải là ContractParty của chính hợp đồng này, nếu không 422 CONTRACT_PARTY_NOT_FOUND
        beneficiaryPartyId:
          type: string
          format: uuid
          description: Phải khác obligorPartyId, nếu không 422 CONTRACT_PARTY_DUPLICATED
        ownerUserId:
          type: string
          format: uuid
          description: Mặc định là người gọi; owner khai báo rõ vẫn phải thuộc cùng tenant
        triggerType: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,29}$'}
        triggerReference: {type: string, minLength: 1, maxLength: 400}
        dueDate: {type: string, format: date}
        consequence: {type: string, minLength: 1, maxLength: 2000}
        appendixId:
          type: string
          format: uuid
          description: Phải là phụ lục của chính hợp đồng này, nếu không 422 APPENDIX_NOT_FOUND
        evidenceRefs:
          type: array
          maxItems: 50
          items: {type: string, maxLength: 500}
      additionalProperties: false
    FulfillObligationRequest:
      type: object
      required: [expectedVersion, decisionType, reason, evidenceRefs]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: versionNo hiện tại của nghĩa vụ; lệch trả 409 VERSION_CONFLICT kèm currentVersion
        decisionType: {$ref: '#/components/schemas/ObligationDecisionType'}
        reason: {type: string, minLength: 3, maxLength: 2000}
        evidenceRefs:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string, maxLength: 500}
          description: FR-040 — không có fulfilment hay waiver nào thiếu bằng chứng
      additionalProperties: false
    CreateBudgetVersionRequest:
      type: object
      required: [currency, totalAmount]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        totalAmount:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: Tiền không âm dạng chuỗi đi nguyên văn vào Postgres numeric(19,4)
        snapshot:
          type: object
          additionalProperties: true
          description: Tùy chọn; được băm canonical vào snapshotHash khi có mặt
      additionalProperties: false
    CreateCommitmentRequest:
      type: object
      required: [contractId, costCodeId, amount, sourceType, sourceId, sourceVersion]
      properties:
        contractId:
          type: string
          format: uuid
          description: Phải thuộc đúng dự án trong path, nếu không 422 CONTRACT_NOT_FOUND
        costCodeId:
          type: string
          format: uuid
          description: Phải tồn tại và ACTIVE, nếu không 422 COST_CODE_NOT_FOUND
        amount:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          description: >-
            Tiền có dấu dạng chuỗi; bản gốc phải dương, bản đảo phải âm và kèm
            reversesCommitmentId — sai dấu trả 422 COMMITMENT_AMOUNT_SIGN_INVALID
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Mặc định theo hợp đồng; giá trị khác trả 422 CURRENCY_MISMATCH
        sourceType: {$ref: '#/components/schemas/CommitmentSourceType'}
        sourceId:
          type: string
          format: uuid
          description: >-
            Với CONTRACT phải trùng contractId (422 COMMITMENT_SOURCE_INVALID); với
            CONTRACT_APPENDIX phải là phụ lục của hợp đồng đó (422 APPENDIX_NOT_FOUND)
        sourceVersion:
          type: integer
          minimum: 1
          description: Cùng (sourceType, sourceId, sourceVersion) chỉ ghi được một lần — 409 COMMITMENT_SOURCE_CONFLICT
        reversesCommitmentId:
          type: string
          format: uuid
          description: Bản gốc bị đảo; phải thuộc dự án, nếu không 422 COMMITMENT_NOT_FOUND
      additionalProperties: false
    PaymentInvoiceInput:
      type: object
      description: >-
        Reuse-or-create trên khóa chống trùng (contract, pháp nhân cung cấp, invoiceNo): trùng
        khóa với đúng facts thì dùng lại hóa đơn cũ, trùng khóa với facts khác trả 409
        INVOICE_DUPLICATE; so khớp số học chạy bằng Postgres numeric.
      required: [invoiceNo, invoiceDate, supplierCompanyId, supplierLegalEntityId, grossAmount, vatAmount, netAmount]
      properties:
        invoiceNo: {type: string, minLength: 1, maxLength: 80}
        invoiceDate: {type: string, format: date}
        supplierCompanyId: {type: string, format: uuid}
        supplierLegalEntityId:
          type: string
          format: uuid
          description: Phải thuộc đúng company trong cùng tenant, nếu không 422 SUPPLIER_NOT_FOUND
        grossAmount: {type: string, pattern: '^\d{1,15}(\.\d{1,4})?$'}
        vatAmount: {type: string, pattern: '^\d{1,15}(\.\d{1,4})?$'}
        netAmount:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: >-
            Lưu như khai báo; quan hệ gross/vat/net cố ý KHÔNG được kiểm hay tính lại vì quy tắc
            thuế là TBD
      additionalProperties: false
    PaymentComponentInput:
      type: object
      required: [sequenceNo, componentType, amount, ruleVersion]
      properties:
        sequenceNo:
          type: integer
          minimum: 1
          description: Trùng (componentType, sequenceNo) trong payment trả 409 COMPONENT_SEQUENCE_CONFLICT
        componentType: {$ref: '#/components/schemas/PaymentComponentType'}
        basisAmount: {type: string, pattern: '^-?\d{1,15}(\.\d{1,4})?$'}
        rate:
          type: string
          pattern: '^-?\d{1,3}(\.\d{1,6})?$'
          description: numeric(9,6) dạng chuỗi
        amount:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,4})?$'
          description: >-
            Tiền có dấu dạng chuỗi; dấu bị ràng theo componentType (422 COMPONENT_SIGN_INVALID) và
            tổng mọi component phải đúng bằng requestedAmount (422 COMPONENT_SUM_MISMATCH)
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Mặc định theo payment; giá trị khác trả 422 CURRENCY_MISMATCH
        ruleVersion: {type: string, minLength: 1, maxLength: 40}
      additionalProperties: false
    PaymentFxSnapshotInput:
      type: object
      description: >-
        Reuse-or-create trên khóa (source, rateDate, cặp tiền); cùng khóa với tỷ giá khác trả 409
        FX_SNAPSHOT_CONFLICT — snapshot bất biến, chỉ ghi lại tỷ giá được payment tham chiếu,
        server không quy đổi gì bằng nó.
      required: [baseCurrency, quoteCurrency, rate, rateDate, source]
      properties:
        baseCurrency: {type: string, pattern: '^[A-Z]{3}$'}
        quoteCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Phải khác baseCurrency, nếu không 422 FX_CURRENCY_INVALID
        rate:
          type: string
          pattern: '^\d{1,16}(\.\d{1,12})?$'
          description: numeric(28,12) dạng chuỗi; phải lớn hơn 0 theo check của DB (422 FX_RATE_INVALID)
        rateDate: {type: string, format: date}
        source: {type: string, minLength: 1, maxLength: 80}
      additionalProperties: false
    CreatePaymentRequest:
      type: object
      required: [payerCompanyId, payerLegalEntityId, payeeCompanyId, payeeLegalEntityId, requestedAmount]
      properties:
        invoice: {$ref: '#/components/schemas/PaymentInvoiceInput'}
        payerCompanyId: {type: string, format: uuid}
        payerLegalEntityId:
          type: string
          format: uuid
          description: Phải thuộc đúng company, nếu không 422 PAYER_NOT_FOUND
        payeeCompanyId: {type: string, format: uuid}
        payeeLegalEntityId:
          type: string
          format: uuid
          description: >-
            Phải thuộc đúng company (422 PAYEE_NOT_FOUND) và khác payerLegalEntityId (422
            PAYER_PAYEE_SAME)
        requestedAmount:
          type: string
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          description: Tiền dạng chuỗi; phải lớn hơn 0 theo check của DB (422 PAYMENT_AMOUNT_INVALID)
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Mặc định theo hợp đồng cha
        milestoneRef: {type: string, minLength: 1, maxLength: 200}
        evidenceRefs:
          type: array
          maxItems: 50
          items: {type: string, maxLength: 500}
        components:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/PaymentComponentInput'}
          description: >-
            Nếu có, tổng amount phải đúng bằng requestedAmount — trigger DEFERRABLE của DB kiểm
            ngay trong transaction, lệch trả 422 COMPONENT_SUM_MISMATCH và cả lát ghi rollback
        fxSnapshot: {$ref: '#/components/schemas/PaymentFxSnapshotInput'}
      additionalProperties: false
    ContractListResponse:
      type: object
      required: [data, meta, correlationId]
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Contract'}
        meta: {$ref: '#/components/schemas/ContractCostPageMeta'}
        correlationId: {type: string}
      additionalProperties: false
    ContractCommandResponse:
      type: object
      required: [data, correlationId]
      properties:
        data: {$ref: '#/components/schemas/Contract'}
