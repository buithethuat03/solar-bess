      description: >-
        Đặt một job export và không làm gì hơn: API kiểm rằng NGAY LÚC NÀY người gọi đọc được
        register đích (`RISK_REGISTER_CSV` cần `riskChange.read`, `DOCUMENT_REGISTER_CSV` cần
        `document.read`), chèn một hàng QUEUED và phát `ReportJob.Requested`; toàn bộ phần còn lại
        thuộc về worker. Nội dung tệp được SINH RA Ở PHÍA SERVER bởi worker, và worker giải lại
        scope của người yêu cầu khi cắt dữ liệu — một người chỉ có package scope chỉ export được
        các hàng thuộc gói của mình. `reportType` là allowlist, mỗi giá trị ánh xạ tới đúng một
        register đã triển khai. Dự án nằm ngoài scope của module đó không phân biệt được với dự án
        không tồn tại: 404 `PROJECT_NOT_FOUND`, và không hàng nào được ghi. Response mang trạng thái
        QUEUED với `download: null` — chi tiết về đường tải nằm ở API-134.
