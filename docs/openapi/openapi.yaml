        signerSnapshot:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/DocumentSigner'}
        artifactHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash của record thuộc revision được ký; envelope không thể tạo nếu revision chưa CLEAN
        status: {$ref: '#/components/schemas/SignatureEnvelopeStatus'}
        completionHash: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        completedAt: {type: [string, 'null'], format: date-time}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
      additionalProperties: false
    CreateDocumentRequest:
      type: object
      required: [documentCode, title, discipline, type, classification]
      properties:
        documentCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_./-]{1,79}$', maxLength: 80}
        title: {type: string, minLength: 3, maxLength: 400}
        discipline: {type: string, minLength: 1, maxLength: 100}
        type: {type: string, minLength: 1, maxLength: 100}
        classification: {$ref: '#/components/schemas/DocumentClassification'}
        packageId:
          type: string
          format: uuid
          description: Phải thuộc đúng dự án trong path, nếu không là 422 PACKAGE_NOT_FOUND
        ownerId:
          type: string
          format: uuid
          description: Mặc định là người gọi; owner khai báo rõ vẫn phải thuộc cùng tenant
      additionalProperties: false
    DocumentUploadSessionRequest:
      type: object
      description: >-
        Body mang chính bytes vì object-storage port không cấp pre-signed URL: server phải là bên
        ghi vào quarantine bucket, nếu không client có thể đặt bytes chưa quét vào đúng nơi mà
        API-043 sẽ đọc như thể đã được thẩm định. Không có trường size hay hash do client khai báo ở
        bước này — cả hai chỉ được server tính sau khi đọc lại bytes trong API-043.
      required: [revisionCode, purpose, fileName, mimeType, content]
      properties:
        revisionCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_.-]{0,39}$', maxLength: 40}
        purpose: {type: string, minLength: 3, maxLength: 200}
        fileName:
          type: string
          minLength: 1
          maxLength: 400
          description: Chỉ là metadata hiển thị; object key được dựng từ định danh nên tên tệp không bao giờ chạm tới storage
        mimeType: {type: string, minLength: 1, maxLength: 200}
        content:
          type: string
          format: byte
          maxLength: 8000000
          description: >-
            Nội dung tệp mã hóa base64, tối đa 8.000.000 ký tự base64. Nội dung giải mã ra 0 byte
            trả 422 EMPTY_UPLOAD.
      additionalProperties: false
    DocumentUploadFinalizeRequest:
      type: object
      description: >-
        Không có upload token: định danh session lấy từ path và bytes đã nằm trong quarantine từ
        API-042.
      properties:
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Hash do client khai báo, tùy chọn. Server luôn tự tính SHA-256 trên bytes đã lưu và chỉ
            *so sánh* giá trị này với hash của mình, không bao giờ dùng thay cho nó; lệch nhau trả
            422 CONTENT_HASH_MISMATCH và không ghi gì. Bỏ trống thì hash của server vẫn là hash của
            record, nên client không thể tự chứng thực nội dung mình tải lên.
      additionalProperties: false
